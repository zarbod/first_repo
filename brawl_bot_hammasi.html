<script id="data" type="application/json">[{"path": "README.md", "code": "# 🏆 Brawl Stars Turnir Boti\n\nPython 3.10+ va **aiogram 3** da yozilgan, SQLite bazali Telegram bot.\n\n## 📁 Loyiha tuzilishi\n\n```\nbrawl_bot/\n├── main.py            # Ishga tushirish fayli\n├── config.py          # .env dan sozlamalarni o'qish\n├── database.py        # SQLite (aiosqlite) — barcha so'rovlar\n├── keyboards.py       # Reply va inline tugmalar\n├── states.py          # FSM holatlari (dialoglar)\n├── middlewares.py     # Foydalanuvchilarni avtomatik saqlash\n├── scheduler.py       # Turnir oldidan eslatma yuborish\n├── utils.py           # Formatlash, tekshirish, xabar yuborish\n├── handlers/\n│   ├── user.py        # Foydalanuvchi funksiyalari\n│   ├── admin.py       # Admin panel\n│   ├── errors.py      # Xatolarni qayta ishlash\n│   └── common.py      # Tushunarsiz xabarlar uchun\n├── requirements.txt\n├── .env.example\n└── README.md\n```\n\n## ⚙️ O'rnatish\n\n1. **Python 3.10+** o'rnatilganini tekshiring: `python --version`\n2. Loyiha papkasiga kiring: `cd brawl_bot`\n3. Virtual muhit yarating va faollashtiring:\n   ```bash\n   python -m venv venv\n   source venv/bin/activate        # Windows: venv\\Scripts\\activate\n   ```\n4. Kutubxonalarni o'rnating:\n   ```bash\n   pip install -r requirements.txt\n   ```\n5. Telegramda **@BotFather** → `/newbot` orqali bot yarating va **tokenni** oling.\n6. Telegram ID ingizni **@userinfobot** dan bilib oling.\n7. `.env.example` ni `.env` ga nusxalang va to'ldiring:\n   ```env\n   BOT_TOKEN=123456789:AAxxxxxxxxxxxxxxxx\n   ADMIN_IDS=123456789\n   TZ_OFFSET=5\n   ```\n   Bir nechta admin: `ADMIN_IDS=111111,222222`\n\n## ▶️ Ishga tushirish\n\n```bash\npython main.py\n```\n\nKonsolda `Bot ishga tushdi: @sizning_botingiz` chiqsa — tayyor. To'xtatish: `Ctrl + C`.\nMa'lumotlar `data/bot.db` da saqlanadi — bot qayta ishga tushganda yo'qolmaydi.\nXatolar `logs/bot.log` fayliga yoziladi.\n\n## 🧪 Botni sinash tartibi\n\n1. Botga `/start` yuboring — asosiy menyu chiqadi.\n2. **Admin akkaunt** bilan «🛠 Admin panel» (yoki `/admin`) → «➕ Turnir yaratish»:\n   nom → rejim → joylar soni (masalan `2`) → sovrin → vaqt (masalan, hozirdan 15 daqiqa keyin, `KK.OO.YYYY SS:DD`).\n3. «📣 Hammaga e'lon qilish» tugmasini bosing.\n4. **Boshqa akkaunt** bilan «📝 Turnirga yozilish» → turnirni tanlang → nickname → player tag (`#2PP0YLQ`).\n5. «🏆 Turnirlar» → turnirni oching: joylar soni yangilanganini ko'ring; «🚪 Turnirdan chiqish»ni sinang.\n6. Joylar sonini to'ldiring — keyingi foydalanuvchiga «joylar tugadi» chiqadi.\n7. Admin: «👥 Ishtirokchilar» (chiqarish), «▶️ Boshlash», «🥇 G'oliblarni belgilash», «🏁 Yakunlash», «📣 Natijalarni e'lon qilish».\n8. Foydalanuvchi: «📊 Mening natijalarim» va «📢 Yangiliklar» ni tekshiring.\n9. **Eslatmani sinash:** boshlanish vaqti 1 soatdan kam qolgan turnir yarating — 30 soniya ichida\n   eslatma keladi (1 soat va 10 daqiqa qolganda avtomatik yuboriladi).\n\n## 💡 Eslatmalar\n\n- Duo va 3v3 da ham ishtirokchilar yakka-yakka yoziladi. G'oliblarni belgilashda bir o'ringa bir nechta o'yinchini qo'shishingiz mumkin.\n- Vaqt `TZ_OFFSET` bo'yicha kiritiladi va ko'rsatiladi (standart: UTC+5).\n- FSM dialoglari xotirada turadi: bot qayta ishga tushsa, yarim qolgan dialog bekor bo'ladi, lekin barcha turnir va ishtirokchi ma'lumotlari saqlanadi.\n- Serverda doimiy ishlatish uchun `systemd`, `pm2` yoki `screen` dan foydalaning.\n"}, {"path": "requirements.txt", "code": "aiogram>=3.7,<4.0\naiosqlite>=0.19\npython-dotenv>=1.0\n"}, {"path": ".env.example", "code": "# Telegram bot tokeni (@BotFather dan oling)\nBOT_TOKEN=123456789:AAxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\n\n# Admin Telegram ID lari (vergul bilan ajrating). ID ni @userinfobot dan bilib oling\nADMIN_IDS=123456789\n\n# Vaqt mintaqasi (UTC dan farq). O'zbekiston uchun 5\nTZ_OFFSET=5\n\n# Ixtiyoriy: baza fayli joylashuvi (standart: data/bot.db)\n# DB_PATH=data/bot.db\n"}, {"path": "main.py", "code": "\"\"\"Brawl Stars Turnir Boti — ishga tushirish fayli.  Ishga tushirish:  python main.py\"\"\"\nimport asyncio\nimport logging\nfrom logging.handlers import RotatingFileHandler\n\nfrom aiogram import Bot, Dispatcher\nfrom aiogram.client.default import DefaultBotProperties\nfrom aiogram.enums import ParseMode\nfrom aiogram.fsm.storage.memory import MemoryStorage\nfrom aiogram.types import BotCommand\n\nfrom config import BOT_TOKEN, LOG_DIR\nfrom database import db\nfrom handlers import admin, common, errors, user\nfrom middlewares import UserTrackMiddleware\nfrom scheduler import reminder_loop\n\n\ndef setup_logging():\n    LOG_DIR.mkdir(parents=True, exist_ok=True)\n    fmt = logging.Formatter(\"%(asctime)s | %(levelname)-8s | %(name)s | %(message)s\")\n    console = logging.StreamHandler()\n    console.setFormatter(fmt)\n    file = RotatingFileHandler(LOG_DIR / \"bot.log\", maxBytes=2_000_000, backupCount=3, encoding=\"utf-8\")\n    file.setFormatter(fmt)\n    logging.basicConfig(level=logging.INFO, handlers=[console, file])\n    logging.getLogger(\"aiosqlite\").setLevel(logging.WARNING)\n\n\nasync def main():\n    setup_logging()\n    log = logging.getLogger(\"main\")\n\n    await db.connect()\n\n    bot = Bot(token=BOT_TOKEN, default=DefaultBotProperties(parse_mode=ParseMode.HTML))\n    dp = Dispatcher(storage=MemoryStorage())\n\n    # Har bir xabar/tugma bosilganda foydalanuvchi bazaga yoziladi\n    dp.message.outer_middleware(UserTrackMiddleware())\n    dp.callback_query.outer_middleware(UserTrackMiddleware())\n\n    # Tartib muhim: errors → user → admin → fallback (eng oxirida)\n    dp.include_routers(errors.router, user.router, admin.router, common.router)\n\n    await bot.set_my_commands([\n        BotCommand(command=\"start\", description=\"🏠 Asosiy menyu\"),\n        BotCommand(command=\"help\", description=\"🆘 Yordam\"),\n        BotCommand(command=\"cancel\", description=\"❌ Amalni bekor qilish\"),\n        BotCommand(command=\"admin\", description=\"🛠 Admin panel (faqat adminlar)\"),\n    ])\n\n    me = await bot.get_me()\n    log.info(\"Bot ishga tushdi: @%s\", me.username)\n\n    await bot.delete_webhook(drop_pending_updates=False)\n    reminder_task = asyncio.create_task(reminder_loop(bot))\n\n    try:\n        await dp.start_polling(bot, allowed_updates=dp.resolve_used_update_types())\n    finally:\n        reminder_task.cancel()\n        await db.close()\n        await bot.session.close()\n        log.info(\"Bot to'xtatildi\")\n\n\nif __name__ == \"__main__\":\n    try:\n        asyncio.run(main())\n    except (KeyboardInterrupt, SystemExit):\n        print(\"\\n🛑 Bot to'xtatildi.\")\n"}, {"path": "config.py", "code": "\"\"\"Bot sozlamalari. Barcha maxfiy ma'lumotlar .env faylidan o'qiladi.\"\"\"\nimport os\nfrom datetime import timedelta, timezone\nfrom pathlib import Path\n\nfrom dotenv import load_dotenv\n\nBASE_DIR = Path(__file__).resolve().parent\nload_dotenv(BASE_DIR / \".env\")\n\n\ndef _parse_admin_ids(raw: str) -> tuple:\n    ids = []\n    for part in raw.replace(\";\", \",\").split(\",\"):\n        part = part.strip()\n        if part.isdigit():\n            ids.append(int(part))\n    return tuple(ids)\n\n\nBOT_TOKEN = os.getenv(\"BOT_TOKEN\", \"\").strip()\nADMIN_IDS = _parse_admin_ids(os.getenv(\"ADMIN_IDS\") or os.getenv(\"ADMIN_ID\", \"\"))\nDB_PATH = os.getenv(\"DB_PATH\") or str(BASE_DIR / \"data\" / \"bot.db\")\nLOG_DIR = BASE_DIR / \"logs\"\n\ntry:\n    TZ_OFFSET = int(os.getenv(\"TZ_OFFSET\", \"5\"))  # O'zbekiston: UTC+5\nexcept ValueError:\n    TZ_OFFSET = 5\n\nTZ = timezone(timedelta(hours=TZ_OFFSET))\nTZ_LABEL = f\"UTC{TZ_OFFSET:+d}\"\n\nif not BOT_TOKEN or \":\" not in BOT_TOKEN:\n    raise SystemExit(\n        \"❌ BOT_TOKEN topilmadi yoki noto'g'ri!\\n\"\n        \"   .env.example faylidan .env nusxasini yarating va BOT_TOKEN ni yozing.\"\n    )\nif not ADMIN_IDS:\n    print(\"⚠️  Ogohlantirish: ADMIN_IDS ko'rsatilmagan — admin panel ishlamaydi.\")\n"}, {"path": "database.py", "code": "\"\"\"SQLite bazasi bilan ishlash (aiosqlite). Ma'lumotlar bot qayta ishga tushganda saqlanadi.\"\"\"\nimport asyncio\nimport logging\nimport time\nfrom pathlib import Path\n\nimport aiosqlite\n\nfrom config import DB_PATH\n\nlog = logging.getLogger(__name__)\n\nSCHEMA = \"\"\"\nCREATE TABLE IF NOT EXISTS users (\n    user_id    INTEGER PRIMARY KEY,\n    username   TEXT,\n    full_name  TEXT,\n    joined_at  INTEGER NOT NULL\n);\n\nCREATE TABLE IF NOT EXISTS tournaments (\n    id           INTEGER PRIMARY KEY AUTOINCREMENT,\n    name         TEXT    NOT NULL,\n    mode         TEXT    NOT NULL,\n    max_players  INTEGER NOT NULL,\n    prize        TEXT    NOT NULL,\n    start_time   INTEGER NOT NULL,\n    status       TEXT    NOT NULL DEFAULT 'upcoming',\n    reminded_60  INTEGER NOT NULL DEFAULT 0,\n    reminded_10  INTEGER NOT NULL DEFAULT 0,\n    created_at   INTEGER NOT NULL\n);\n\nCREATE TABLE IF NOT EXISTS participants (\n    id             INTEGER PRIMARY KEY AUTOINCREMENT,\n    tournament_id  INTEGER NOT NULL REFERENCES tournaments(id) ON DELETE CASCADE,\n    user_id        INTEGER NOT NULL,\n    nickname       TEXT    NOT NULL,\n    player_tag     TEXT    NOT NULL,\n    joined_at      INTEGER NOT NULL,\n    UNIQUE (tournament_id, user_id)\n);\n\nCREATE TABLE IF NOT EXISTS winners (\n    tournament_id  INTEGER NOT NULL REFERENCES tournaments(id) ON DELETE CASCADE,\n    user_id        INTEGER NOT NULL,\n    place          INTEGER NOT NULL,\n    PRIMARY KEY (tournament_id, user_id)\n);\n\nCREATE TABLE IF NOT EXISTS news (\n    id          INTEGER PRIMARY KEY AUTOINCREMENT,\n    text        TEXT    NOT NULL,\n    created_at  INTEGER NOT NULL\n);\n\nCREATE INDEX IF NOT EXISTS idx_part_user ON participants(user_id);\nCREATE INDEX IF NOT EXISTS idx_tour_status ON tournaments(status, start_time);\n\"\"\"\n\nTOURNAMENT_SELECT = (\n    \"SELECT t.*, (SELECT COUNT(*) FROM participants p WHERE p.tournament_id = t.id) AS cnt \"\n    \"FROM tournaments t\"\n)\nEDITABLE = {\"name\", \"mode\", \"max_players\", \"prize\", \"start_time\", \"status\"}\n\n\nclass Database:\n    def __init__(self, path: str):\n        self.path = path\n        self.conn: aiosqlite.Connection = None\n        self.lock = asyncio.Lock()\n\n    # ───────────── ulanish ─────────────\n    async def connect(self):\n        Path(self.path).parent.mkdir(parents=True, exist_ok=True)\n        self.conn = await aiosqlite.connect(self.path)\n        self.conn.row_factory = aiosqlite.Row\n        await self.conn.execute(\"PRAGMA foreign_keys = ON\")\n        await self.conn.execute(\"PRAGMA journal_mode = WAL\")\n        await self.conn.executescript(SCHEMA)\n        await self.conn.commit()\n        log.info(\"Baza ulandi: %s\", self.path)\n\n    async def close(self):\n        if self.conn:\n            await self.conn.close()\n            self.conn = None\n\n    # ───────────── past darajadagi yordamchilar ─────────────\n    async def _all(self, sql: str, params: tuple = ()) -> list:\n        async with self.conn.execute(sql, params) as cur:\n            return [dict(r) for r in await cur.fetchall()]\n\n    async def _one(self, sql: str, params: tuple = ()):\n        async with self.conn.execute(sql, params) as cur:\n            row = await cur.fetchone()\n            return dict(row) if row else None\n\n    async def _write(self, sql: str, params: tuple = ()):\n        async with self.lock:\n            async with self.conn.execute(sql, params) as cur:\n                lastrowid, rowcount = cur.lastrowid, cur.rowcount\n            await self.conn.commit()\n            return lastrowid, rowcount\n\n    # ───────────── foydalanuvchilar ─────────────\n    async def upsert_user(self, user_id: int, username: str, full_name: str):\n        await self._write(\n            \"INSERT INTO users (user_id, username, full_name, joined_at) VALUES (?,?,?,?) \"\n            \"ON CONFLICT(user_id) DO UPDATE SET username=excluded.username, full_name=excluded.full_name\",\n            (user_id, username, full_name, int(time.time())),\n        )\n\n    async def all_user_ids(self) -> list:\n        return [r[\"user_id\"] for r in await self._all(\"SELECT user_id FROM users\")]\n\n    # ───────────── turnirlar ─────────────\n    async def create_tournament(self, name, mode, max_players, prize, start_time) -> int:\n        tid, _ = await self._write(\n            \"INSERT INTO tournaments (name, mode, max_players, prize, start_time, created_at) \"\n            \"VALUES (?,?,?,?,?,?)\",\n            (name, mode, max_players, prize, start_time, int(time.time())),\n        )\n        return tid\n\n    async def get_tournament(self, tid: int):\n        return await self._one(f\"{TOURNAMENT_SELECT} WHERE t.id = ?\", (tid,))\n\n    async def list_tournaments(self, statuses=None, limit: int = 30, order: str = \"t.start_time ASC\") -> list:\n        sql = TOURNAMENT_SELECT\n        params = []\n        if statuses:\n            sql += \" WHERE t.status IN (%s)\" % \",\".join(\"?\" * len(statuses))\n            params.extend(statuses)\n        sql += f\" ORDER BY {order} LIMIT ?\"  # order faqat kod ichidan keladi\n        params.append(limit)\n        return await self._all(sql, tuple(params))\n\n    async def update_tournament(self, tid: int, **fields):\n        fields = {k: v for k, v in fields.items() if k in EDITABLE}\n        if not fields:\n            return\n        if \"start_time\" in fields:  # vaqt o'zgarsa, eslatmalar qayta yoqiladi\n            fields[\"reminded_60\"] = 0\n            fields[\"reminded_10\"] = 0\n        cols = \", \".join(f\"{k} = ?\" for k in fields)\n        await self._write(f\"UPDATE tournaments SET {cols} WHERE id = ?\", (*fields.values(), tid))\n\n    async def mark_reminded(self, tid: int, column: str):\n        if column not in (\"reminded_60\", \"reminded_10\"):\n            return\n        await self._write(f\"UPDATE tournaments SET {column} = 1 WHERE id = ?\", (tid,))\n\n    async def delete_tournament(self, tid: int):\n        await self._write(\"DELETE FROM tournaments WHERE id = ?\", (tid,))\n\n    # ───────────── ishtirokchilar ─────────────\n    async def count_participants(self, tid: int) -> int:\n        r = await self._one(\"SELECT COUNT(*) AS c FROM participants WHERE tournament_id = ?\", (tid,))\n        return r[\"c\"]\n\n    async def list_participants(self, tid: int) -> list:\n        return await self._all(\n            \"SELECT * FROM participants WHERE tournament_id = ? ORDER BY joined_at, id\", (tid,)\n        )\n\n    async def get_participant(self, tid: int, uid: int):\n        return await self._one(\n            \"SELECT * FROM participants WHERE tournament_id = ? AND user_id = ?\", (tid, uid)\n        )\n\n    async def join(self, tid: int, uid: int, nickname: str, tag: str) -> str:\n        \"\"\"Natija: ok | not_found | closed | exists | tag_taken | full\"\"\"\n        async with self.lock:  # joylar soni poygasini (race condition) oldini oladi\n            t = await self._one(f\"{TOURNAMENT_SELECT} WHERE t.id = ?\", (tid,))\n            if not t:\n                return \"not_found\"\n            if t[\"status\"] != \"upcoming\" or t[\"start_time\"] <= time.time():\n                return \"closed\"\n            if await self._one(\n                \"SELECT 1 FROM participants WHERE tournament_id=? AND user_id=?\", (tid, uid)\n            ):\n                return \"exists\"\n            if await self._one(\n                \"SELECT 1 FROM participants WHERE tournament_id=? AND player_tag=?\", (tid, tag)\n            ):\n                return \"tag_taken\"\n            if t[\"cnt\"] >= t[\"max_players\"]:\n                return \"full\"\n            await self.conn.execute(\n                \"INSERT INTO participants (tournament_id, user_id, nickname, player_tag, joined_at) \"\n                \"VALUES (?,?,?,?,?)\",\n                (tid, uid, nickname, tag, int(time.time())),\n            )\n            await self.conn.commit()\n            return \"ok\"\n\n    async def leave(self, tid: int, uid: int) -> bool:\n        async with self.lock:\n            await self.conn.execute(\n                \"DELETE FROM winners WHERE tournament_id=? AND user_id=?\", (tid, uid)\n            )\n            cur = await self.conn.execute(\n                \"DELETE FROM participants WHERE tournament_id=? AND user_id=?\", (tid, uid)\n            )\n            removed = cur.rowcount > 0\n            await cur.close()\n            await self.conn.commit()\n            return removed\n\n    # ───────────── g'oliblar ─────────────\n    async def set_winner(self, tid: int, uid: int, place: int):\n        await self._write(\n            \"INSERT OR REPLACE INTO winners (tournament_id, user_id, place) VALUES (?,?,?)\",\n            (tid, uid, place),\n        )\n\n    async def clear_winners(self, tid: int):\n        await self._write(\"DELETE FROM winners WHERE tournament_id = ?\", (tid,))\n\n    async def get_winners(self, tid: int) -> list:\n        return await self._all(\n            \"SELECT w.place, w.user_id, p.nickname, p.player_tag FROM winners w \"\n            \"LEFT JOIN participants p ON p.tournament_id = w.tournament_id AND p.user_id = w.user_id \"\n            \"WHERE w.tournament_id = ? ORDER BY w.place, p.nickname\",\n            (tid,),\n        )\n\n    # ───────────── foydalanuvchi natijalari ─────────────\n    async def user_history(self, uid: int, limit: int = 10) -> list:\n        return await self._all(\n            \"SELECT t.id, t.name, t.mode, t.status, w.place FROM participants p \"\n            \"JOIN tournaments t ON t.id = p.tournament_id \"\n            \"LEFT JOIN winners w ON w.tournament_id = p.tournament_id AND w.user_id = p.user_id \"\n            \"WHERE p.user_id = ? ORDER BY t.start_time DESC LIMIT ?\",\n            (uid, limit),\n        )\n\n    async def user_stats(self, uid: int) -> dict:\n        r = await self._one(\n            \"SELECT COUNT(*) AS total, COALESCE(SUM(w.place = 1), 0) AS wins, COUNT(w.place) AS podium \"\n            \"FROM participants p LEFT JOIN winners w \"\n            \"ON w.tournament_id = p.tournament_id AND w.user_id = p.user_id WHERE p.user_id = ?\",\n            (uid,),\n        )\n        return r or {\"total\": 0, \"wins\": 0, \"podium\": 0}\n\n    # ───────────── yangiliklar ─────────────\n    async def add_news(self, text: str):\n        await self._write(\"INSERT INTO news (text, created_at) VALUES (?,?)\", (text, int(time.time())))\n\n    async def last_news(self, limit: int = 5) -> list:\n        return await self._all(\"SELECT * FROM news ORDER BY id DESC LIMIT ?\", (limit,))\n\n    # ───────────── statistika ─────────────\n    async def stats(self) -> dict:\n        day_ago = int(time.time()) - 86400\n        q = self._one\n        users = (await q(\"SELECT COUNT(*) AS c FROM users\"))[\"c\"]\n        new_users = (await q(\"SELECT COUNT(*) AS c FROM users WHERE joined_at >= ?\", (day_ago,)))[\"c\"]\n        parts = (await q(\"SELECT COUNT(*) AS c FROM participants\"))[\"c\"]\n        uniq = (await q(\"SELECT COUNT(DISTINCT user_id) AS c FROM participants\"))[\"c\"]\n        winners = (await q(\"SELECT COUNT(*) AS c FROM winners\"))[\"c\"]\n        news = (await q(\"SELECT COUNT(*) AS c FROM news\"))[\"c\"]\n        by_status = {\"upcoming\": 0, \"ongoing\": 0, \"finished\": 0}\n        for r in await self._all(\"SELECT status, COUNT(*) AS c FROM tournaments GROUP BY status\"):\n            by_status[r[\"status\"]] = r[\"c\"]\n        return {\n            \"users\": users, \"new_users\": new_users, \"participations\": parts,\n            \"unique_players\": uniq, \"winners\": winners, \"news\": news, **by_status,\n        }\n\n\ndb = Database(DB_PATH)\n"}, {"path": "utils.py", "code": "\"\"\"Yordamchi funksiyalar: formatlash, tekshirish, xabar yuborish.\"\"\"\nimport asyncio\nimport html\nimport logging\nimport re\nimport time\nfrom datetime import datetime\n\nfrom aiogram import Bot\nfrom aiogram.exceptions import (\n    TelegramAPIError,\n    TelegramBadRequest,\n    TelegramForbiddenError,\n    TelegramRetryAfter,\n)\n\nfrom config import TZ, TZ_LABEL\n\nlog = logging.getLogger(__name__)\n\n# ───────────────────────── Konstantalar ─────────────────────────\nMODES = {\n    \"solo\": \"🔫 Solo Showdown\",\n    \"duo\": \"🤝 Duo Showdown\",\n    \"3v3\": \"⚔️ 3v3\",\n}\nMODE_ICONS = {\"solo\": \"🔫\", \"duo\": \"🤝\", \"3v3\": \"⚔️\"}\n\nSTATUS_LABELS = {\n    \"open\": \"🟢 Ro'yxatga olish ochiq\",\n    \"full\": \"🔴 Joylar tugadi\",\n    \"closed\": \"🟡 Ro'yxat yopilgan\",\n    \"ongoing\": \"🔥 Davom etmoqda\",\n    \"finished\": \"🏁 Yakunlangan\",\n}\nSTATUS_ICONS = {\"upcoming\": \"🟢\", \"ongoing\": \"🔥\", \"finished\": \"🏁\"}\nPLACE_ICONS = {1: \"🥇\", 2: \"🥈\", 3: \"🥉\"}\n\n# Brawl Stars player tag da faqat shu belgilar ishlatiladi\nTAG_RE = re.compile(r\"^#[0289PYLQGRJCUV]{3,15}$\")\n\n\n# ───────────────────────── Matn / vaqt ─────────────────────────\ndef esc(value) -> str:\n    \"\"\"HTML belgilarini xavfsiz qilish.\"\"\"\n    return html.escape(str(value), quote=False)\n\n\ndef short(text: str, n: int = 30) -> str:\n    return text if len(text) <= n else text[: n - 1] + \"…\"\n\n\ndef now_ts() -> int:\n    return int(time.time())\n\n\ndef fmt_dt(ts: int, with_tz: bool = False) -> str:\n    s = datetime.fromtimestamp(ts, TZ).strftime(\"%d.%m.%Y %H:%M\")\n    return f\"{s} ({TZ_LABEL})\" if with_tz else s\n\n\ndef parse_dt(text: str):\n    \"\"\"'25.10.2026 18:00' formatini timestamp ga aylantiradi.\"\"\"\n    try:\n        dt = datetime.strptime(text.strip(), \"%d.%m.%Y %H:%M\")\n    except ValueError:\n        return None\n    return int(dt.replace(tzinfo=TZ).timestamp())\n\n\ndef example_dt() -> str:\n    return fmt_dt(now_ts() + 86400)\n\n\ndef time_left(ts: int) -> str:\n    sec = ts - now_ts()\n    if sec <= 0:\n        return \"boshlanish vaqti keldi\"\n    d, rem = divmod(sec, 86400)\n    h, rem = divmod(rem, 3600)\n    m = rem // 60\n    parts = []\n    if d:\n        parts.append(f\"{d} kun\")\n    if h:\n        parts.append(f\"{h} soat\")\n    if m or not parts:\n        parts.append(f\"{m} daqiqa\")\n    return \" \".join(parts)\n\n\ndef normalize_tag(raw: str):\n    \"\"\"Player tagni tekshiradi. Noto'g'ri bo'lsa None qaytaradi.\"\"\"\n    tag = raw.strip().upper().replace(\"O\", \"0\").replace(\" \", \"\")\n    if not tag.startswith(\"#\"):\n        tag = \"#\" + tag\n    return tag if TAG_RE.match(tag) else None\n\n\ndef progress(cnt: int, total: int) -> str:\n    total = max(total, 1)\n    filled = min(10, round(10 * cnt / total))\n    return f\"{'▰' * filled}{'▱' * (10 - filled)}  <b>{cnt}/{total}<\/b>\"\n\n\n# ───────────────────────── Turnir holati ─────────────────────────\ndef effective_status(t: dict, cnt: int) -> str:\n    \"\"\"open | full | closed | ongoing | finished\"\"\"\n    if t[\"status\"] == \"finished\":\n        return \"finished\"\n    if t[\"status\"] == \"ongoing\":\n        return \"ongoing\"\n    if now_ts() >= t[\"start_time\"]:\n        return \"closed\"\n    if cnt >= t[\"max_players\"]:\n        return \"full\"\n    return \"open\"\n\n\n# ───────────────────────── Matn quruvchilar ─────────────────────────\ndef tournament_text(t: dict, cnt: int = None) -> str:\n    if cnt is None:\n        cnt = t.get(\"cnt\", 0)\n    st = effective_status(t, cnt)\n    left = \"\"\n    if t[\"status\"] == \"upcoming\" and t[\"start_time\"] > now_ts():\n        left = f\"\\n⏳ <b>Qoldi:<\/b> {time_left(t['start_time'])}\"\n    return (\n        f\"🏆 <b>{esc(t['name'])}<\/b>\\n\"\n        \"━━━━━━━━━━━━━━━━━━\\n\"\n        f\"🎮 <b>Rejim:<\/b> {MODES.get(t['mode'], t['mode'])}\\n\"\n        f\"👥 <b>Joylar:<\/b> {progress(cnt, t['max_players'])}\\n\"\n        f\"💰 <b>Sovrin:<\/b> {esc(t['prize'])}\\n\"\n        f\"🕒 <b>Boshlanish:<\/b> {fmt_dt(t['start_time'], True)}\"\n        f\"{left}\\n\"\n        f\"📌 <b>Holat:<\/b> {STATUS_LABELS[st]}\\n\"\n        f\"🆔 <code>#{t['id']}<\/code>\"\n    )\n\n\ndef participants_text(parts: list, offset: int = 0, limit: int = None) -> str:\n    if not parts:\n        return \"😴 Hali hech kim ro'yxatdan o'tmagan.\"\n    shown = parts if limit is None else parts[:limit]\n    lines = [\n        f\"{offset + i}. <b>{esc(p['nickname'])}<\/b> — <code>{esc(p['player_tag'])}<\/code>\"\n        for i, p in enumerate(shown, 1)\n    ]\n    if limit is not None and len(parts) > limit:\n        lines.append(f\"… va yana {len(parts) - limit} ta ishtirokchi\")\n    return \"\\n\".join(lines)\n\n\ndef winners_lines(winners: list) -> str:\n    if not winners:\n        return \"— hali belgilanmagan\"\n    out = []\n    for w in winners:\n        icon = PLACE_ICONS.get(w[\"place\"], \"🏅\")\n        nick = esc(w.get(\"nickname\") or \"Noma'lum\")\n        tag = esc(w.get(\"player_tag\") or \"-\")\n        out.append(f\"{icon} {w['place']}-o'rin: <b>{nick}<\/b> (<code>{tag}<\/code>)\")\n    return \"\\n\".join(out)\n\n\ndef winners_text(t: dict, winners: list) -> str:\n    return (\n        f\"🏁 <b>{esc(t['name'])}<\/b> — NATIJALAR\\n\"\n        \"━━━━━━━━━━━━━━━━━━\\n\"\n        f\"🎮 {MODES.get(t['mode'], t['mode'])}\\n\"\n        f\"💰 Sovrin: {esc(t['prize'])}\\n\\n\"\n        f\"{winners_lines(winners)}\\n\\n\"\n        \"🎉 G'oliblarni tabriklaymiz! Barcha ishtirokchilarga rahmat 💛\"\n    )\n\n\n# ───────────────────────── Telegram yordamchilari ─────────────────────────\nasync def safe_edit(message, text: str, reply_markup=None):\n    \"\"\"Xabarni tahrirlaydi; imkoni bo'lmasa yangi xabar yuboradi.\"\"\"\n    try:\n        await message.edit_text(text, reply_markup=reply_markup)\n    except TelegramBadRequest as e:\n        if \"message is not modified\" in str(e):\n            return\n        await message.answer(text, reply_markup=reply_markup)\n\n\nasync def broadcast(bot: Bot, user_ids: list, text: str, reply_markup=None):\n    \"\"\"Ko'pchilikka xabar yuboradi. (muvaffaqiyatli, muvaffaqiyatsiz) qaytaradi.\"\"\"\n    ok = fail = 0\n    for uid in user_ids:\n        try:\n            await bot.send_message(uid, text, reply_markup=reply_markup)\n            ok += 1\n        except TelegramRetryAfter as e:\n            await asyncio.sleep(e.retry_after + 1)\n            try:\n                await bot.send_message(uid, text, reply_markup=reply_markup)\n                ok += 1\n            except TelegramAPIError:\n                fail += 1\n        except (TelegramForbiddenError, TelegramBadRequest):\n            fail += 1  # foydalanuvchi botni bloklagan\n        except TelegramAPIError:\n            fail += 1\n        await asyncio.sleep(0.05)  # Telegram limitlaridan oshib ketmaslik uchun\n    return ok, fail\n\n\n_tasks: set = set()\n\n\ndef spawn(coro):\n    \"\"\"Fon vazifasini ishga tushiradi (admin kutib qolmasligi uchun).\"\"\"\n    task = asyncio.create_task(coro)\n    _tasks.add(task)\n    task.add_done_callback(_tasks.discard)\n    return task\n\n\nasync def broadcast_report(bot: Bot, user_ids: list, text: str, report_to: int = None,\n                           label: str = \"Xabar\", reply_markup=None):\n    \"\"\"Fon rejimida yuboradi va yakunida adminga hisobot beradi.\"\"\"\n    try:\n        ok, fail = await broadcast(bot, user_ids, text, reply_markup)\n        if report_to:\n            await bot.send_message(\n                report_to,\n                f\"📨 <b>{esc(label)}<\/b>\\n✅ Yetkazildi: <b>{ok}<\/b>\\n❌ Yetmadi: <b>{fail}<\/b>\",\n            )\n    except Exception:  # noqa: BLE001\n        log.exception(\"Broadcast vazifasida xatolik\")\n"}, {"path": "keyboards.py", "code": "\"\"\"Barcha tugmalar (reply va inline).\"\"\"\nfrom aiogram.types import (\n    InlineKeyboardButton,\n    InlineKeyboardMarkup,\n    KeyboardButton,\n    ReplyKeyboardMarkup,\n)\n\nfrom utils import MODES, MODE_ICONS, STATUS_ICONS, short\n\n# ───────────── Asosiy menyu tugmalari matni ─────────────\nBTN_TOURS = \"🏆 Turnirlar\"\nBTN_JOIN = \"📝 Turnirga yozilish\"\nBTN_PARTS = \"👥 Ishtirokchilar\"\nBTN_RESULTS = \"📊 Mening natijalarim\"\nBTN_NEWS = \"📢 Yangiliklar\"\nBTN_HELP = \"🆘 Yordam\"\nBTN_ADMIN = \"🛠 Admin panel\"\nBTN_CANCEL = \"❌ Bekor qilish\"\n\nMENU_BUTTONS = (BTN_TOURS, BTN_JOIN, BTN_PARTS, BTN_RESULTS, BTN_NEWS, BTN_HELP)\n\n\ndef _b(text: str, cb: str) -> InlineKeyboardButton:\n    return InlineKeyboardButton(text=text, callback_data=cb)\n\n\ndef _kb(rows: list) -> InlineKeyboardMarkup:\n    return InlineKeyboardMarkup(inline_keyboard=rows)\n\n\ndef _k(text: str) -> KeyboardButton:\n    return KeyboardButton(text=text)\n\n\n# ═════════════════ REPLY KLAVIATURALAR ═════════════════\ndef main_menu(is_admin: bool = False) -> ReplyKeyboardMarkup:\n    rows = [\n        [_k(BTN_TOURS), _k(BTN_JOIN)],\n        [_k(BTN_PARTS), _k(BTN_RESULTS)],\n        [_k(BTN_NEWS), _k(BTN_HELP)],\n    ]\n    if is_admin:\n        rows.append([_k(BTN_ADMIN)])\n    return ReplyKeyboardMarkup(\n        keyboard=rows, resize_keyboard=True, input_field_placeholder=\"Menyudan tanlang 👇\"\n    )\n\n\ndef cancel_kb() -> ReplyKeyboardMarkup:\n    return ReplyKeyboardMarkup(keyboard=[[_k(BTN_CANCEL)]], resize_keyboard=True)\n\n\n# ═════════════════ FOYDALANUVCHI INLINE ═════════════════\ndef tournaments_kb(ts: list, prefix: str, refresh_cb: str,\n                   finished_btn: bool = False, back_cb: str = None) -> InlineKeyboardMarkup:\n    rows = []\n    for t in ts:\n        label = f\"{MODE_ICONS.get(t['mode'], '🎮')} {short(t['name'], 26)} • {t['cnt']}/{t['max_players']}\"\n        rows.append([_b(label, f\"{prefix}:{t['id']}\")])\n    nav = [_b(\"🔄 Yangilash\", refresh_cb)]\n    if finished_btn:\n        nav.append(_b(\"🏁 Yakunlanganlar\", \"tfin\"))\n    if back_cb:\n        nav.append(_b(\"⬅️ Orqaga\", back_cb))\n    rows.append(nav)\n    return _kb(rows)\n\n\ndef card_kb(tid: int, can_join: bool, can_leave: bool, finished: bool) -> InlineKeyboardMarkup:\n    rows = []\n    if can_join:\n        rows.append([_b(\"📝 Turnirga yozilish\", f\"tj:{tid}\")])\n    if can_leave:\n        rows.append([_b(\"🚪 Turnirdan chiqish\", f\"tlv:{tid}\")])\n    if finished:\n        rows.append([_b(\"🏅 Natijalar\", f\"tr:{tid}\")])\n    rows.append([_b(\"👥 Ishtirokchilar\", f\"tp:{tid}\"), _b(\"🔄 Yangilash\", f\"tl:{tid}\")])\n    rows.append([_b(\"⬅️ Turnirlar ro'yxati\", \"tlist\")])\n    return _kb(rows)\n\n\ndef leave_confirm_kb(tid: int) -> InlineKeyboardMarkup:\n    return _kb([[_b(\"✅ Ha, chiqaman\", f\"tlvy:{tid}\"), _b(\"⬅️ Yo'q, qolaman\", f\"tl:{tid}\")]])\n\n\ndef parts_back_kb(tid: int) -> InlineKeyboardMarkup:\n    return _kb([[_b(\"🔄 Yangilash\", f\"tp:{tid}\"), _b(\"⬅️ Orqaga\", f\"tl:{tid}\")]])\n\n\ndef results_back_kb(tid: int) -> InlineKeyboardMarkup:\n    return _kb([[_b(\"⬅️ Orqaga\", f\"tl:{tid}\")]])\n\n\ndef view_tournament_kb(tid: int) -> InlineKeyboardMarkup:\n    return _kb([[_b(\"📝 Ko'rish va yozilish\", f\"tl:{tid}\")]])\n\n\n# ═════════════════ ADMIN INLINE ═════════════════\ndef admin_menu() -> InlineKeyboardMarkup:\n    return _kb([\n        [_b(\"➕ Turnir yaratish\", \"a:create\"), _b(\"✏️ Tahrirlash\", \"ap:edit\")],\n        [_b(\"🗑 O'chirish\", \"ap:del\"), _b(\"▶️ Boshlash\", \"ap:start\")],\n        [_b(\"🏁 Yakunlash\", \"ap:finish\"), _b(\"👥 Ishtirokchilar\", \"ap:parts\")],\n        [_b(\"🥇 G'oliblarni belgilash\", \"ap:win\")],\n        [_b(\"📣 Natijalarni e'lon qilish\", \"ap:ann\")],\n        [_b(\"✉️ Hammaga xabar\", \"a:bc\"), _b(\"📢 Yangilik qo'shish\", \"a:news\")],\n        [_b(\"📊 Statistika\", \"a:stats\")],\n    ])\n\n\ndef admin_back_kb() -> InlineKeyboardMarkup:\n    return _kb([[_b(\"⬅️ Admin panel\", \"a:menu\")]])\n\n\ndef admin_pick_kb(ts: list, action: str) -> InlineKeyboardMarkup:\n    rows = []\n    for t in ts:\n        icon = STATUS_ICONS.get(t[\"status\"], \"•\")\n        rows.append([_b(f\"{icon} #{t['id']} {short(t['name'], 26)} ({t['cnt']}/{t['max_players']})\",\n                        f\"ax:{action}:{t['id']}\")])\n    rows.append([_b(\"⬅️ Admin panel\", \"a:menu\")])\n    return _kb(rows)\n\n\ndef mode_kb(prefix: str, suffix: str = \"\") -> InlineKeyboardMarkup:\n    rows = [[_b(label, f\"{prefix}:{key}{suffix}\")] for key, label in MODES.items()]\n    rows.append([_b(\"⬅️ Admin panel\", \"a:menu\")])\n    return _kb(rows)\n\n\ndef edit_fields_kb(tid: int) -> InlineKeyboardMarkup:\n    return _kb([\n        [_b(\"📝 Nomi\", f\"ae:name:{tid}\"), _b(\"🎮 Rejimi\", f\"ae:mode:{tid}\")],\n        [_b(\"👥 Joylar soni\", f\"ae:max:{tid}\"), _b(\"💰 Sovrin\", f\"ae:prize:{tid}\")],\n        [_b(\"🕒 Boshlanish vaqti\", f\"ae:time:{tid}\")],\n        [_b(\"⬅️ Orqaga\", \"ap:edit\")],\n    ])\n\n\ndef confirm_kb(action: str, tid: int, yes_text: str = \"✅ Tasdiqlayman\") -> InlineKeyboardMarkup:\n    return _kb([[_b(yes_text, f\"ay:{action}:{tid}\"), _b(\"❌ Bekor\", \"a:menu\")]])\n\n\ndef created_kb(tid: int) -> InlineKeyboardMarkup:\n    return _kb([\n        [_b(\"📣 Hammaga e'lon qilish\", f\"an:{tid}\")],\n        [_b(\"🛠 Admin panel\", \"a:menu\")],\n    ])\n\n\ndef admin_parts_kb(tid: int, page_parts: list, page: int, total_pages: int) -> InlineKeyboardMarkup:\n    rows = []\n    for p in page_parts:\n        rows.append([_b(f\"❌ {short(p['nickname'], 22)} {p['player_tag']}\", f\"ak:{tid}:{p['user_id']}:{page}\")])\n    if total_pages > 1:\n        nav = []\n        if page > 0:\n            nav.append(_b(\"⬅️\", f\"apg:{tid}:{page - 1}\"))\n        nav.append(_b(f\"{page + 1}/{total_pages}\", \"noop\"))\n        if page < total_pages - 1:\n            nav.append(_b(\"➡️\", f\"apg:{tid}:{page + 1}\"))\n        rows.append(nav)\n    rows.append([_b(\"⬅️ Orqaga\", \"ap:parts\")])\n    return _kb(rows)\n\n\ndef winners_menu_kb(tid: int) -> InlineKeyboardMarkup:\n    return _kb([\n        [_b(\"🥇 1-o'rin\", f\"awp:{tid}:1\"), _b(\"🥈 2-o'rin\", f\"awp:{tid}:2\"), _b(\"🥉 3-o'rin\", f\"awp:{tid}:3\")],\n        [_b(\"🧹 Hammasini tozalash\", f\"awc:{tid}\")],\n        [_b(\"⬅️ Orqaga\", \"ap:win\")],\n    ])\n\n\ndef pick_winner_kb(tid: int, place: int, parts: list) -> InlineKeyboardMarkup:\n    rows, row = [], []\n    for p in parts:\n        row.append(_b(short(p[\"nickname\"], 18), f\"aws:{tid}:{place}:{p['user_id']}\"))\n        if len(row) == 2:\n            rows.append(row)\n            row = []\n    if row:\n        rows.append(row)\n    rows.append([_b(\"⬅️ Orqaga\", f\"ax:win:{tid}\")])\n    return _kb(rows)\n\n\ndef broadcast_confirm_kb() -> InlineKeyboardMarkup:\n    return _kb([[_b(\"✅ Yuborish\", \"bc:yes\"), _b(\"❌ Bekor\", \"a:menu\")]])\n\n\ndef news_confirm_kb() -> InlineKeyboardMarkup:\n    return _kb([\n        [_b(\"✅ Saqlash va hammaga yuborish\", \"nw:send\")],\n        [_b(\"💾 Faqat saqlash\", \"nw:save\")],\n        [_b(\"❌ Bekor\", \"a:menu\")],\n    ])\n"}, {"path": "states.py", "code": "\"\"\"FSM holatlari (ko'p bosqichli dialoglar uchun).\"\"\"\nfrom aiogram.fsm.state import State, StatesGroup\n\n\nclass JoinState(StatesGroup):\n    nickname = State()\n    tag = State()\n\n\nclass CreateState(StatesGroup):\n    name = State()\n    mode = State()\n    max_players = State()\n    prize = State()\n    start_time = State()\n\n\nclass EditState(StatesGroup):\n    value = State()\n\n\nclass BroadcastState(StatesGroup):\n    text = State()\n    confirm = State()\n\n\nclass NewsState(StatesGroup):\n    text = State()\n    confirm = State()\n"}, {"path": "middlewares.py", "code": "\"\"\"Middleware: har bir foydalanuvchini bazaga avtomatik yozib boradi.\"\"\"\nimport logging\n\nfrom aiogram import BaseMiddleware\n\nfrom database import db\n\nlog = logging.getLogger(__name__)\n\n\nclass UserTrackMiddleware(BaseMiddleware):\n    async def __call__(self, handler, event, data):\n        user = getattr(event, \"from_user\", None)\n        if user and not user.is_bot:\n            try:\n                await db.upsert_user(user.id, user.username, user.full_name)\n            except Exception:  # noqa: BLE001\n                log.exception(\"Foydalanuvchini saqlashda xatolik\")\n        return await handler(event, data)\n"}, {"path": "scheduler.py", "code": "\"\"\"Turnir boshlanishidan oldin eslatma yuboruvchi fon vazifasi.\"\"\"\nimport asyncio\nimport logging\n\nfrom aiogram import Bot\n\nfrom database import db\nfrom utils import broadcast, esc, fmt_dt, MODES, now_ts, time_left\n\nlog = logging.getLogger(__name__)\n\nCHECK_EVERY = 30  # soniya\n# (bazadagi ustun, necha soniya qolganda yuboriladi)\nWINDOWS = ((\"reminded_60\", 3600), (\"reminded_10\", 600))\n\n\nasync def check_reminders(bot: Bot):\n    now = now_ts()\n    for t in await db.list_tournaments((\"upcoming\",), limit=200):\n        left = t[\"start_time\"] - now\n        if left <= 0:\n            continue\n        for column, window in WINDOWS:\n            if t[column] or left > window:\n                continue\n            await db.mark_reminded(t[\"id\"], column)  # avval belgilaymiz — ikki marta yuborilmasin\n            if window == 3600 and left <= 600:\n                continue  # 10 daqiqadan kam qolgan — faqat 10 daqiqalik eslatma yuboriladi\n            ids = [p[\"user_id\"] for p in await db.list_participants(t[\"id\"])]\n            if not ids:\n                continue\n            text = (\n                \"⏰ <b>ESLATMA!<\/b>\\n\\n\"\n                f\"🏆 <b>{esc(t['name'])}<\/b> turniri boshlanishiga \"\n                f\"<b>{time_left(t['start_time'])}<\/b> qoldi!\\n\"\n                f\"🎮 Rejim: {MODES.get(t['mode'], t['mode'])}\\n\"\n                f\"🕒 Boshlanish: {fmt_dt(t['start_time'], True)}\\n\\n\"\n                \"Brawl Stars ga kirishga tayyor bo'ling! 🔥\"\n            )\n            ok, fail = await broadcast(bot, ids, text)\n            log.info(\"Eslatma (%s) turnir #%s: ok=%s fail=%s\", column, t[\"id\"], ok, fail)\n\n\nasync def reminder_loop(bot: Bot):\n    log.info(\"Eslatma tizimi ishga tushdi\")\n    while True:\n        try:\n            await check_reminders(bot)\n        except asyncio.CancelledError:\n            raise\n        except Exception:  # noqa: BLE001\n            log.exception(\"Eslatmalarni tekshirishda xatolik\")\n        await asyncio.sleep(CHECK_EVERY)\n"}, {"path": "handlers/__init__.py", "code": ""}, {"path": "handlers/user.py", "code": "\"\"\"Oddiy foydalanuvchi uchun handlerlar.\"\"\"\nimport logging\n\nfrom aiogram import F, Router\nfrom aiogram.filters import Command, CommandStart, StateFilter\nfrom aiogram.fsm.context import FSMContext\nfrom aiogram.types import CallbackQuery, Message\n\nimport keyboards as kb\nfrom config import ADMIN_IDS\nfrom database import db\nfrom states import JoinState\nfrom utils import (\n    MODES,\n    effective_status,\n    esc,\n    fmt_dt,\n    normalize_tag,\n    participants_text,\n    safe_edit,\n    tournament_text,\n    winners_text,\n)\n\nlog = logging.getLogger(__name__)\nrouter = Router(name=\"user\")\n\n\ndef is_admin(uid: int) -> bool:\n    return uid in ADMIN_IDS\n\n\nWELCOME = (\n    \"👋 Salom, <b>{name}<\/b>!\\n\\n\"\n    \"🎮 <b>Brawl Stars Turnir Botiga<\/b> xush kelibsiz!\\n\"\n    \"━━━━━━━━━━━━━━━━━━\\n\"\n    \"Bu yerda siz:\\n\"\n    \"🏆 Solo, Duo va 3v3 turnirlarini ko'rishingiz\\n\"\n    \"📝 Turnirlarga yozilishingiz\\n\"\n    \"📊 O'z natijalaringizni kuzatishingiz\\n\"\n    \"📢 Eng so'nggi yangiliklarni bilib borishingiz mumkin.\\n\\n\"\n    \"Boshlash uchun pastdagi menyudan foydalaning 👇\"\n)\n\nHELP_TEXT = (\n    \"🆘 <b>Yordam<\/b>\\n\"\n    \"━━━━━━━━━━━━━━━━━━\\n\"\n    \"<b>Turnirga qanday yozilaman?<\/b>\\n\"\n    \"1️⃣ «📝 Turnirga yozilish» tugmasini bosing\\n\"\n    \"2️⃣ Ochiq turnirni tanlang\\n\"\n    \"3️⃣ Brawl Stars <b>nickname<\/b>ingizni yuboring\\n\"\n    \"4️⃣ <b>Player tag<\/b>ingizni yuboring (masalan: <code>#2PP0YLQ<\/code>)\\n\\n\"\n    \"<b>Player tagni qayerdan topaman?<\/b>\\n\"\n    \"Brawl Stars → o'z profilingiz → ismingiz ostidagi <code>#...<\/code> kod.\\n\\n\"\n    \"<b>Turnirdan qanday chiqaman?<\/b>\\n\"\n    \"«🏆 Turnirlar» → turnirni tanlang → «🚪 Turnirdan chiqish».\\n\"\n    \"Turnir boshlangandan keyin chiqib bo'lmaydi.\\n\\n\"\n    \"<b>Eslatmalar<\/b>\\n\"\n    \"Turnir boshlanishiga 1 soat va 10 daqiqa qolganda bot sizga eslatma yuboradi. \"\n    \"Botni bloklamang! 🔔\\n\\n\"\n    \"<b>Buyruqlar:<\/b> /start — menyu, /cancel — amalni bekor qilish\"\n)\n\n\n# ═════════════════ Yordamchi ko'rinishlar ═════════════════\nasync def tours_view(finished: bool = False):\n    if finished:\n        ts = await db.list_tournaments((\"finished\",), limit=10, order=\"t.start_time DESC\")\n        title = \"🏁 <b>Yakunlangan turnirlar<\/b>\"\n        empty = \"Hali yakunlangan turnirlar yo'q.\"\n        markup = kb.tournaments_kb(ts, \"tl\", \"tfin\", back_cb=\"tlist\")\n    else:\n        ts = await db.list_tournaments((\"upcoming\", \"ongoing\"))\n        title = \"🏆 <b>Turnirlar<\/b>\"\n        empty = \"Hozircha faol turnirlar yo'q. Tez orada yangilari e'lon qilinadi! 🔔\"\n        markup = kb.tournaments_kb(ts, \"tl\", \"tlist\", finished_btn=True)\n    text = f\"{title}\\n━━━━━━━━━━━━━━━━━━\\n\" + (\n        \"Batafsil ma'lumot uchun turnirni tanlang 👇\" if ts else empty\n    )\n    return text, markup\n\n\nasync def join_view():\n    ts = await db.list_tournaments((\"upcoming\",))\n    ts = [t for t in ts if effective_status(t, t[\"cnt\"]) == \"open\"]\n    text = \"📝 <b>Turnirga yozilish<\/b>\\n━━━━━━━━━━━━━━━━━━\\n\" + (\n        \"Ro'yxatga olish ochiq turnirlar. Birini tanlang 👇\"\n        if ts else \"Hozircha ro'yxatga olish ochiq turnir yo'q. 😔\\nYangiliklarni kuzatib boring!\"\n    )\n    return text, kb.tournaments_kb(ts, \"tj\", \"jlist\")\n\n\nasync def parts_pick_view():\n    ts = await db.list_tournaments((\"upcoming\", \"ongoing\"))\n    text = \"👥 <b>Ishtirokchilar<\/b>\\n━━━━━━━━━━━━━━━━━━\\n\" + (\n        \"Qaysi turnir ishtirokchilarini ko'rmoqchisiz?\" if ts else \"Hozircha faol turnirlar yo'q.\"\n    )\n    return text, kb.tournaments_kb(ts, \"tp\", \"plist\")\n\n\nasync def build_card(uid: int, tid: int):\n    t = await db.get_tournament(tid)\n    if not t:\n        return None\n    st = effective_status(t, t[\"cnt\"])\n    joined = await db.get_participant(tid, uid) is not None\n    text = tournament_text(t)\n    if joined:\n        text += \"\\n\\n✅ <b>Siz ushbu turnirga yozilgansiz.<\/b>\"\n    markup = kb.card_kb(\n        tid,\n        can_join=(st == \"open\" and not joined),\n        can_leave=(joined and t[\"status\"] == \"upcoming\"),\n        finished=(t[\"status\"] == \"finished\"),\n    )\n    return text, markup\n\n\n# ═════════════════ Buyruqlar va asosiy menyu ═════════════════\n@router.message(CommandStart())\nasync def cmd_start(message: Message, state: FSMContext):\n    await state.clear()\n    await message.answer(\n        WELCOME.format(name=esc(message.from_user.full_name)),\n        reply_markup=kb.main_menu(is_admin(message.from_user.id)),\n    )\n\n\n@router.message(Command(\"cancel\"))\n@router.message(F.text == kb.BTN_CANCEL)\nasync def cmd_cancel(message: Message, state: FSMContext):\n    cur = await state.get_state()\n    await state.clear()\n    await message.answer(\n        \"↩️ Amal bekor qilindi.\" if cur else \"Bekor qilinadigan amal yo'q.\",\n        reply_markup=kb.main_menu(is_admin(message.from_user.id)),\n    )\n\n\n@router.message(Command(\"help\"))\n@router.message(F.text == kb.BTN_HELP)\nasync def menu_help(message: Message, state: FSMContext):\n    await state.clear()\n    await message.answer(HELP_TEXT)\n\n\n@router.message(F.text == kb.BTN_TOURS)\nasync def menu_tours(message: Message, state: FSMContext):\n    await state.clear()\n    text, markup = await tours_view()\n    await message.answer(text, reply_markup=markup)\n\n\n@router.message(F.text == kb.BTN_JOIN)\nasync def menu_join(message: Message, state: FSMContext):\n    await state.clear()\n    text, markup = await join_view()\n    await message.answer(text, reply_markup=markup)\n\n\n@router.message(F.text == kb.BTN_PARTS)\nasync def menu_parts(message: Message, state: FSMContext):\n    await state.clear()\n    text, markup = await parts_pick_view()\n    await message.answer(text, reply_markup=markup)\n\n\n@router.message(F.text == kb.BTN_RESULTS)\nasync def menu_results(message: Message, state: FSMContext):\n    await state.clear()\n    uid = message.from_user.id\n    stats = await db.user_stats(uid)\n    history = await db.user_history(uid, 10)\n    text = (\n        \"📊 <b>Mening natijalarim<\/b>\\n\"\n        \"━━━━━━━━━━━━━━━━━━\\n\"\n        f\"👤 <b>{esc(message.from_user.full_name)}<\/b>\\n\\n\"\n        f\"🎮 Qatnashgan turnirlar: <b>{stats['total']}<\/b>\\n\"\n        f\"🥇 G'alabalar: <b>{stats['wins']}<\/b>\\n\"\n        f\"🏅 Sovrinli o'rinlar: <b>{stats['podium']}<\/b>\\n\"\n    )\n    if history:\n        text += \"\\n📜 <b>So'nggi turnirlar:<\/b>\\n\"\n        for h in history:\n            if h[\"place\"]:\n                res = {1: \"🥇\", 2: \"🥈\", 3: \"🥉\"}.get(h[\"place\"], \"🏅\") + f\" {h['place']}-o'rin\"\n            elif h[\"status\"] == \"finished\":\n                res = \"✔️ Qatnashdi\"\n            elif h[\"status\"] == \"ongoing\":\n                res = \"🔥 Davom etmoqda\"\n            else:\n                res = \"⏳ Kutilmoqda\"\n            text += f\"• {esc(h['name'])} ({MODES.get(h['mode'], h['mode'])}) — {res}\\n\"\n    else:\n        text += \"\\nSiz hali birorta turnirda qatnashmagansiz. «📝 Turnirga yozilish» tugmasini bosing! 🚀\"\n    await message.answer(text)\n\n\n@router.message(F.text == kb.BTN_NEWS)\nasync def menu_news(message: Message, state: FSMContext):\n    await state.clear()\n    news = await db.last_news(5)\n    if not news:\n        await message.answer(\"📢 <b>Yangiliklar<\/b>\\n━━━━━━━━━━━━━━━━━━\\nHozircha yangilik yo'q.\")\n        return\n    text = \"📢 <b>So'nggi yangiliklar<\/b>\\n━━━━━━━━━━━━━━━━━━\\n\"\n    for n in news:\n        block = f\"\\n🗓 <i>{fmt_dt(n['created_at'])}<\/i>\\n{n['text']}\\n\"\n        if len(text) + len(block) > 3800:\n            break\n        text += block + \"\\n──────────────\\n\"\n    await message.answer(text)\n\n\n# ═════════════════ Ro'yxatlar (inline) ═════════════════\n@router.callback_query(F.data == \"tlist\")\nasync def cb_tlist(cb: CallbackQuery):\n    text, markup = await tours_view()\n    await safe_edit(cb.message, text, markup)\n    await cb.answer()\n\n\n@router.callback_query(F.data == \"tfin\")\nasync def cb_tfin(cb: CallbackQuery):\n    text, markup = await tours_view(finished=True)\n    await safe_edit(cb.message, text, markup)\n    await cb.answer()\n\n\n@router.callback_query(F.data == \"jlist\")\nasync def cb_jlist(cb: CallbackQuery):\n    text, markup = await join_view()\n    await safe_edit(cb.message, text, markup)\n    await cb.answer(\"🔄 Yangilandi\")\n\n\n@router.callback_query(F.data == \"plist\")\nasync def cb_plist(cb: CallbackQuery):\n    text, markup = await parts_pick_view()\n    await safe_edit(cb.message, text, markup)\n    await cb.answer(\"🔄 Yangilandi\")\n\n\n@router.callback_query(F.data == \"noop\")\nasync def cb_noop(cb: CallbackQuery):\n    await cb.answer()\n\n\n# ═════════════════ Turnir kartochkasi ═════════════════\n@router.callback_query(F.data.startswith(\"tl:\"))\nasync def cb_card(cb: CallbackQuery):\n    tid = int(cb.data.split(\":\")[1])\n    card = await build_card(cb.from_user.id, tid)\n    if not card:\n        await cb.answer(\"❌ Bu turnir topilmadi (o'chirilgan bo'lishi mumkin).\", show_alert=True)\n        return\n    await safe_edit(cb.message, *card)\n    await cb.answer()\n\n\n@router.callback_query(F.data.startswith(\"tp:\"))\nasync def cb_participants(cb: CallbackQuery):\n    tid = int(cb.data.split(\":\")[1])\n    t = await db.get_tournament(tid)\n    if not t:\n        await cb.answer(\"❌ Turnir topilmadi.\", show_alert=True)\n        return\n    parts = await db.list_participants(tid)\n    text = (\n        f\"👥 <b>{esc(t['name'])}<\/b> — ishtirokchilar\\n\"\n        f\"━━━━━━━━━━━━━━━━━━\\n\"\n        f\"Jami: <b>{len(parts)}/{t['max_players']}<\/b>\\n\\n\"\n        f\"{participants_text(parts, limit=60)}\"\n    )\n    await safe_edit(cb.message, text, kb.parts_back_kb(tid))\n    await cb.answer()\n\n\n@router.callback_query(F.data.startswith(\"tr:\"))\nasync def cb_results(cb: CallbackQuery):\n    tid = int(cb.data.split(\":\")[1])\n    t = await db.get_tournament(tid)\n    if not t:\n        await cb.answer(\"❌ Turnir topilmadi.\", show_alert=True)\n        return\n    winners = await db.get_winners(tid)\n    if not winners:\n        await cb.answer(\"Natijalar hali e'lon qilinmagan.\", show_alert=True)\n        return\n    await safe_edit(cb.message, winners_text(t, winners), kb.results_back_kb(tid))\n    await cb.answer()\n\n\n# ═════════════════ Turnirga yozilish (FSM) ═════════════════\n@router.callback_query(F.data.startswith(\"tj:\"))\nasync def cb_join_start(cb: CallbackQuery, state: FSMContext):\n    tid = int(cb.data.split(\":\")[1])\n    t = await db.get_tournament(tid)\n    if not t:\n        await cb.answer(\"❌ Turnir topilmadi.\", show_alert=True)\n        return\n    if await db.get_participant(tid, cb.from_user.id):\n        await cb.answer(\"✅ Siz allaqachon ushbu turnirga yozilgansiz.\", show_alert=True)\n        return\n    st = effective_status(t, t[\"cnt\"])\n    if st != \"open\":\n        reasons = {\n            \"full\": \"🔴 Afsuski, barcha joylar band.\",\n            \"closed\": \"🟡 Ro'yxatga olish yopilgan.\",\n            \"ongoing\": \"🔥 Turnir allaqachon boshlangan.\",\n            \"finished\": \"🏁 Turnir yakunlangan.\",\n        }\n        await cb.answer(reasons.get(st, \"Ro'yxatga olish yopiq.\"), show_alert=True)\n        return\n    await state.clear()\n    await state.set_state(JoinState.nickname)\n    await state.update_data(tid=tid)\n    await cb.message.answer(\n        f\"📝 <b>{esc(t['name'])}<\/b> turniriga yozilish\\n\"\n        \"━━━━━━━━━━━━━━━━━━\\n\"\n        \"<b>1/2<\/b> — Brawl Stars <b>nickname<\/b>ingizni yuboring:\",\n        reply_markup=kb.cancel_kb(),\n    )\n    await cb.answer()\n\n\n@router.message(StateFilter(JoinState.nickname), F.text)\nasync def join_nickname(message: Message, state: FSMContext):\n    nick = message.text.strip()\n    if not 1 <= len(nick) <= 30:\n        await message.answer(\"⚠️ Nickname 1 tadan 30 tagacha belgidan iborat bo'lishi kerak. Qayta yuboring:\")\n        return\n    await state.update_data(nickname=nick)\n    await state.set_state(JoinState.tag)\n    await message.answer(\n        \"<b>2/2<\/b> — Endi <b>player tag<\/b>ingizni yuboring.\\n\\n\"\n        \"Masalan: <code>#2PP0YLQ<\/code>\\n\"\n        \"<i>Brawl Stars → profil → ismingiz ostidagi # bilan boshlanuvchi kod.<\/i>\"\n    )\n\n\n@router.message(StateFilter(JoinState.tag), F.text)\nasync def join_tag(message: Message, state: FSMContext):\n    tag = normalize_tag(message.text)\n    if not tag:\n        await message.answer(\n            \"⚠️ Player tag noto'g'ri formatda.\\n\"\n            \"Tag <code>#<\/code> bilan boshlanadi va faqat <code>0289PYLQGRJCUV<\/code> \"\n            \"belgilaridan iborat bo'ladi.\\nMasalan: <code>#2PP0YLQ<\/code>. Qayta yuboring:\"\n        )\n        return\n    data = await state.get_data()\n    tid, nick = data.get(\"tid\"), data.get(\"nickname\")\n    if tid is None or not nick:\n        await state.clear()\n        await message.answer(\"⚠️ Sessiya tugadi. Qaytadan urinib ko'ring.\",\n                             reply_markup=kb.main_menu(is_admin(message.from_user.id)))\n        return\n\n    result = await db.join(tid, message.from_user.id, nick, tag)\n    menu = kb.main_menu(is_admin(message.from_user.id))\n\n    if result == \"tag_taken\":\n        await message.answer(\"⚠️ Bu player tag ushbu turnirda allaqachon ro'yxatdan o'tgan. \"\n                             \"Boshqa tag yuboring yoki «❌ Bekor qilish» ni bosing:\")\n        return\n\n    await state.clear()\n    if result == \"ok\":\n        await message.answer(\n            \"🎉 <b>Tabriklaymiz! Siz turnirga muvaffaqiyatli yozildingiz!<\/b>\\n\\n\"\n            f\"👤 Nickname: <b>{esc(nick)}<\/b>\\n\"\n            f\"🏷 Player tag: <code>{tag}<\/code>\\n\\n\"\n            \"Turnir boshlanishidan oldin sizga eslatma yuboramiz 🔔\",\n            reply_markup=menu,\n        )\n        card = await build_card(message.from_user.id, tid)\n        if card:\n            await message.answer(*card)\n        return\n\n    errors = {\n        \"full\": \"🔴 Afsuski, siz ulgurmadingiz — joylar tugadi.\",\n        \"closed\": \"🟡 Ro'yxatga olish yopildi.\",\n        \"exists\": \"✅ Siz allaqachon ushbu turnirga yozilgansiz.\",\n        \"not_found\": \"❌ Turnir topilmadi (o'chirilgan bo'lishi mumkin).\",\n    }\n    await message.answer(errors.get(result, \"⚠️ Noma'lum xatolik.\"), reply_markup=menu)\n\n\n# ═════════════════ Turnirdan chiqish ═════════════════\n@router.callback_query(F.data.startswith(\"tlv:\"))\nasync def cb_leave_ask(cb: CallbackQuery):\n    tid = int(cb.data.split(\":\")[1])\n    t = await db.get_tournament(tid)\n    if not t or not await db.get_participant(tid, cb.from_user.id):\n        await cb.answer(\"Siz bu turnirda ro'yxatda emassiz.\", show_alert=True)\n        return\n    if t[\"status\"] != \"upcoming\":\n        await cb.answer(\"Turnir boshlangan — chiqib bo'lmaydi.\", show_alert=True)\n        return\n    await safe_edit(\n        cb.message,\n        f\"🚪 <b>{esc(t['name'])}<\/b> turnirdan chiqishni tasdiqlaysizmi?\\n\\n\"\n        \"Joyingiz bo'shaydi va boshqa o'yinchi egallashi mumkin.\",\n        kb.leave_confirm_kb(tid),\n    )\n    await cb.answer()\n\n\n@router.callback_query(F.data.startswith(\"tlvy:\"))\nasync def cb_leave_do(cb: CallbackQuery):\n    tid = int(cb.data.split(\":\")[1])\n    t = await db.get_tournament(tid)\n    if not t:\n        await cb.answer(\"Turnir topilmadi.\", show_alert=True)\n        return\n    if t[\"status\"] != \"upcoming\":\n        await cb.answer(\"Turnir boshlangan — chiqib bo'lmaydi.\", show_alert=True)\n        return\n    removed = await db.leave(tid, cb.from_user.id)\n    await cb.answer(\"✅ Siz turnirdan chiqdingiz.\" if removed else \"Siz ro'yxatda emas edingiz.\",\n                    show_alert=True)\n    card = await build_card(cb.from_user.id, tid)\n    if card:\n        await safe_edit(cb.message, *card)\n"}, {"path": "handlers/admin.py", "code": "\"\"\"Admin panel handlerlari.\"\"\"\nimport logging\nimport math\n\nfrom aiogram import Bot, F, Router\nfrom aiogram.filters import Command, StateFilter\nfrom aiogram.fsm.context import FSMContext\nfrom aiogram.types import CallbackQuery, Message\n\nimport keyboards as kb\nfrom config import ADMIN_IDS\nfrom database import db\nfrom states import BroadcastState, CreateState, EditState, NewsState\nfrom utils import (\n    MODES,\n    broadcast_report,\n    esc,\n    example_dt,\n    fmt_dt,\n    now_ts,\n    parse_dt,\n    participants_text,\n    safe_edit,\n    spawn,\n    tournament_text,\n    winners_lines,\n    winners_text,\n    TZ_LABEL,\n)\n\nlog = logging.getLogger(__name__)\nrouter = Router(name=\"admin\")\nrouter.message.filter(F.from_user.id.in_(ADMIN_IDS))\nrouter.callback_query.filter(F.from_user.id.in_(ADMIN_IDS))\n\nADMIN_TEXT = \"🛠 <b>Admin panel<\/b>\\n━━━━━━━━━━━━━━━━━━\\nKerakli bo'limni tanlang:\"\nPAGE_SIZE = 15\n\nPICK_TITLES = {\n    \"edit\": \"✏️ Qaysi turnirni tahrirlaymiz?\",\n    \"del\": \"🗑 Qaysi turnirni o'chiramiz?\",\n    \"start\": \"▶️ Qaysi turnirni boshlaymiz?\",\n    \"finish\": \"🏁 Qaysi turnirni yakunlaymiz?\",\n    \"parts\": \"👥 Qaysi turnir ishtirokchilarini ko'ramiz?\",\n    \"win\": \"🥇 Qaysi turnir g'oliblarini belgilaymiz?\",\n    \"ann\": \"📣 Qaysi turnir natijalarini e'lon qilamiz?\",\n}\nPICK_STATUSES = {\n    \"edit\": (\"upcoming\", \"ongoing\"),\n    \"start\": (\"upcoming\",),\n    \"finish\": (\"upcoming\", \"ongoing\"),\n}\n\n\n# ═════════════════ Tekshiruvchilar (validatorlar) ═════════════════\ndef validate_name(raw: str):\n    if not 3 <= len(raw) <= 60:\n        return None, \"⚠️ Turnir nomi 3 tadan 60 tagacha belgidan iborat bo'lishi kerak. Qayta yuboring:\"\n    return raw, None\n\n\ndef validate_max(raw: str):\n    if not raw.isdigit() or not 2 <= int(raw) <= 500:\n        return None, \"⚠️ Joylar soni 2 dan 500 gacha butun son bo'lishi kerak. Qayta yuboring:\"\n    return int(raw), None\n\n\ndef validate_prize(raw: str):\n    if not 1 <= len(raw) <= 100:\n        return None, \"⚠️ Sovrin matni 1 tadan 100 tagacha belgidan iborat bo'lsin. Qayta yuboring:\"\n    return raw, None\n\n\ndef validate_time(raw: str):\n    ts = parse_dt(raw)\n    if ts is None:\n        return None, f\"⚠️ Format noto'g'ri. To'g'ri format: <code>{example_dt()}<\/code>\\nQayta yuboring:\"\n    if ts <= now_ts():\n        return None, \"⚠️ Boshlanish vaqti kelajakda bo'lishi kerak. Qayta yuboring:\"\n    return ts, None\n\n\nasync def finish_flow(message: Message, text: str, markup=None):\n    \"\"\"Matnli dialog tugagach: oddiy menyuni tiklaydi va natijani ko'rsatadi.\"\"\"\n    await message.answer(text, reply_markup=kb.main_menu(True))\n    await message.answer(ADMIN_TEXT if markup is None else \"👇\", reply_markup=markup or kb.admin_menu())\n\n\nasync def participant_ids(tid: int) -> list:\n    return [p[\"user_id\"] for p in await db.list_participants(tid)]\n\n\n# ═════════════════ Admin panelga kirish ═════════════════\n@router.message(Command(\"admin\"))\n@router.message(F.text == kb.BTN_ADMIN)\nasync def open_admin(message: Message, state: FSMContext):\n    await state.clear()\n    await message.answer(ADMIN_TEXT, reply_markup=kb.admin_menu())\n\n\n@router.callback_query(F.data == \"a:menu\")\nasync def cb_admin_menu(cb: CallbackQuery, state: FSMContext):\n    cur = await state.get_state()\n    await state.clear()\n    await safe_edit(cb.message, ADMIN_TEXT, kb.admin_menu())\n    if cur:  # dialog bekor qilindi — oddiy menyuni qaytaramiz\n        await cb.message.answer(\"↩️ Amal bekor qilindi.\", reply_markup=kb.main_menu(True))\n    await cb.answer()\n\n\n# ═════════════════ Statistika ═════════════════\n@router.callback_query(F.data == \"a:stats\")\nasync def cb_stats(cb: CallbackQuery):\n    s = await db.stats()\n    text = (\n        \"📊 <b>Bot statistikasi<\/b>\\n\"\n        \"━━━━━━━━━━━━━━━━━━\\n\"\n        f\"👤 Foydalanuvchilar: <b>{s['users']}<\/b> (so'nggi 24 soatda: +{s['new_users']})\\n\"\n        f\"🏆 Turnirlar: <b>{s['upcoming'] + s['ongoing'] + s['finished']}<\/b>\\n\"\n        f\"   🟢 Kutilayotgan: {s['upcoming']}\\n\"\n        f\"   🔥 Davom etayotgan: {s['ongoing']}\\n\"\n        f\"   🏁 Yakunlangan: {s['finished']}\\n\"\n        f\"📝 Jami ro'yxatdan o'tishlar: <b>{s['participations']}<\/b>\\n\"\n        f\"🎮 Noyob o'yinchilar: <b>{s['unique_players']}<\/b>\\n\"\n        f\"🏅 Belgilangan g'oliblar: <b>{s['winners']}<\/b>\\n\"\n        f\"📢 Yangiliklar: <b>{s['news']}<\/b>\"\n    )\n    await safe_edit(cb.message, text, kb.admin_back_kb())\n    await cb.answer()\n\n\n# ═════════════════ Turnir tanlash ═════════════════\n@router.callback_query(F.data.startswith(\"ap:\"))\nasync def cb_pick(cb: CallbackQuery):\n    action = cb.data.split(\":\")[1]\n    ts = await db.list_tournaments(PICK_STATUSES.get(action), limit=30, order=\"t.start_time DESC\")\n    if not ts:\n        await cb.answer(\"Bu amal uchun mos turnir yo'q.\", show_alert=True)\n        return\n    await safe_edit(cb.message, f\"{PICK_TITLES.get(action, 'Turnirni tanlang:')}\\n━━━━━━━━━━━━━━━━━━\",\n                    kb.admin_pick_kb(ts, action))\n    await cb.answer()\n\n\n# ═════════════════ Ko'rinishlar ═════════════════\nasync def parts_view(tid: int, page: int = 0):\n    t = await db.get_tournament(tid)\n    parts = await db.list_participants(tid)\n    pages = max(1, math.ceil(len(parts) / PAGE_SIZE))\n    page = max(0, min(page, pages - 1))\n    chunk = parts[page * PAGE_SIZE:(page + 1) * PAGE_SIZE]\n    text = (\n        f\"👥 <b>{esc(t['name'])}<\/b> — ishtirokchilar ({len(parts)}/{t['max_players']})\\n\"\n        \"━━━━━━━━━━━━━━━━━━\\n\"\n        f\"{participants_text(chunk, offset=page * PAGE_SIZE)}\\n\\n\"\n        \"<i>Ishtirokchini chiqarish uchun uning tugmasini bosing.<\/i>\"\n    )\n    return text, kb.admin_parts_kb(tid, chunk, page, pages)\n\n\nasync def win_view(tid: int):\n    t = await db.get_tournament(tid)\n    winners = await db.get_winners(tid)\n    text = (\n        f\"🥇 <b>{esc(t['name'])}<\/b> — g'oliblar\\n\"\n        \"━━━━━━━━━━━━━━━━━━\\n\"\n        f\"{winners_lines(winners)}\\n\\n\"\n        \"<i>O'rinni tanlang, so'ng ishtirokchini belgilang. \"\n        \"Duo/3v3 da bir o'ringa bir nechta o'yinchini qo'shishingiz mumkin.<\/i>\"\n    )\n    return text, kb.winners_menu_kb(tid)\n\n\n# ═════════════════ Turnir ustida amallar ═════════════════\n@router.callback_query(F.data.startswith(\"ax:\"))\nasync def cb_action(cb: CallbackQuery):\n    _, action, tid_raw = cb.data.split(\":\")\n    tid = int(tid_raw)\n    t = await db.get_tournament(tid)\n    if not t:\n        await cb.answer(\"❌ Turnir topilmadi.\", show_alert=True)\n        return\n\n    if action == \"edit\":\n        await safe_edit(cb.message, f\"{tournament_text(t)}\\n\\n✏️ Qaysi maydonni o'zgartiramiz?\",\n                        kb.edit_fields_kb(tid))\n    elif action == \"del\":\n        await safe_edit(\n            cb.message,\n            f\"🗑 <b>{esc(t['name'])}<\/b> turnirini o'chirishni tasdiqlaysizmi?\\n\\n\"\n            f\"⚠️ {t['cnt']} ta ishtirokchi ma'lumoti ham o'chadi va ularga xabar yuboriladi.\",\n            kb.confirm_kb(\"del\", tid, \"🗑 Ha, o'chirish\"),\n        )\n    elif action == \"start\":\n        await safe_edit(\n            cb.message,\n            f\"▶️ <b>{esc(t['name'])}<\/b> turnirini boshlaymizmi?\\n\\n\"\n            f\"👥 Ishtirokchilar: {t['cnt']}/{t['max_players']}\\n\"\n            \"Ro'yxatga olish yopiladi va ishtirokchilarga xabar yuboriladi.\",\n            kb.confirm_kb(\"start\", tid, \"▶️ Ha, boshlash\"),\n        )\n    elif action == \"finish\":\n        await safe_edit(\n            cb.message,\n            f\"🏁 <b>{esc(t['name'])}<\/b> turnirini yakunlaymizmi?\\n\\n\"\n            \"Ishtirokchilarga xabar yuboriladi.\",\n            kb.confirm_kb(\"finish\", tid, \"🏁 Ha, yakunlash\"),\n        )\n    elif action == \"parts\":\n        text, markup = await parts_view(tid)\n        await safe_edit(cb.message, text, markup)\n    elif action == \"win\":\n        text, markup = await win_view(tid)\n        await safe_edit(cb.message, text, markup)\n    elif action == \"ann\":\n        winners = await db.get_winners(tid)\n        if not winners:\n            await cb.answer(\"Avval g'oliblarni belgilang! (🥇 G'oliblarni belgilash)\", show_alert=True)\n            return\n        await safe_edit(\n            cb.message,\n            \"📣 <b>E'lon ko'rinishi:<\/b>\\n\\n\" + winners_text(t, winners)\n            + \"\\n\\n━━━━━━━━━━━━━━━━━━\\nUshbu e'lon <b>barcha foydalanuvchilarga<\/b> yuboriladi va \"\n              \"yangiliklarga qo'shiladi. Davom etamizmi?\",\n            kb.confirm_kb(\"ann\", tid, \"📣 Ha, e'lon qilish\"),\n        )\n    await cb.answer()\n\n\n@router.callback_query(F.data.startswith(\"ay:\"))\nasync def cb_confirm(cb: CallbackQuery, bot: Bot):\n    _, action, tid_raw = cb.data.split(\":\")\n    tid = int(tid_raw)\n    t = await db.get_tournament(tid)\n    if not t:\n        await cb.answer(\"❌ Turnir topilmadi (allaqachon o'chirilgan).\", show_alert=True)\n        return\n    admin_id = cb.from_user.id\n    name = esc(t[\"name\"])\n\n    if action == \"del\":\n        ids = await participant_ids(tid)\n        await db.delete_tournament(tid)\n        if ids:\n            spawn(broadcast_report(\n                bot, ids, f\"❌ <b>{name}<\/b> turniri bekor qilindi.\\nNoqulaylik uchun uzr so'raymiz.\",\n                report_to=admin_id, label=\"Bekor qilish xabari\"))\n        result = f\"✅ <b>{name}<\/b> turniri o'chirildi.\"\n\n    elif action == \"start\":\n        if t[\"status\"] != \"upcoming\":\n            await cb.answer(\"Bu turnir allaqachon boshlangan yoki yakunlangan.\", show_alert=True)\n            return\n        await db.update_tournament(tid, status=\"ongoing\")\n        ids = await participant_ids(tid)\n        if ids:\n            spawn(broadcast_report(\n                bot, ids,\n                f\"🔥 <b>{name}<\/b> turniri BOSHLANDI!\\n\\n\"\n                f\"🎮 Rejim: {MODES.get(t['mode'], t['mode'])}\\n\"\n                \"Brawl Stars ga kiring va admin ko'rsatmalariga amal qiling. Omad! 🍀\",\n                report_to=admin_id, label=\"Boshlanish xabari\"))\n        result = f\"▶️ <b>{name}<\/b> turniri boshlandi. Ishtirokchilar: {len(ids)}\"\n\n    elif action == \"finish\":\n        if t[\"status\"] == \"finished\":\n            await cb.answer(\"Bu turnir allaqachon yakunlangan.\", show_alert=True)\n            return\n        await db.update_tournament(tid, status=\"finished\")\n        ids = await participant_ids(tid)\n        if ids:\n            spawn(broadcast_report(\n                bot, ids,\n                f\"🏁 <b>{name}<\/b> turniri yakunlandi!\\nQatnashganingiz uchun rahmat. \"\n                \"Natijalar tez orada e'lon qilinadi 📢\",\n                report_to=admin_id, label=\"Yakunlash xabari\"))\n        result = f\"🏁 <b>{name}<\/b> turniri yakunlandi.\"\n\n    elif action == \"ann\":\n        winners = await db.get_winners(tid)\n        if not winners:\n            await cb.answer(\"Avval g'oliblarni belgilang!\", show_alert=True)\n            return\n        if t[\"status\"] != \"finished\":\n            await db.update_tournament(tid, status=\"finished\")\n        text = winners_text(t, winners)\n        await db.add_news(text)\n        ids = await db.all_user_ids()\n        spawn(broadcast_report(bot, ids, text, report_to=admin_id, label=\"Natijalar e'loni\"))\n        result = f\"📣 <b>{name}<\/b> natijalari e'lon qilinmoqda ({len(ids)} ta foydalanuvchi)...\"\n    else:\n        await cb.answer(\"Noma'lum amal.\", show_alert=True)\n        return\n\n    await safe_edit(cb.message, result, kb.admin_back_kb())\n    await cb.answer(\"✅ Bajarildi\")\n\n\n# ═════════════════ Ishtirokchilarni boshqarish ═════════════════\n@router.callback_query(F.data.startswith(\"apg:\"))\nasync def cb_parts_page(cb: CallbackQuery):\n    _, tid, page = cb.data.split(\":\")\n    if not await db.get_tournament(int(tid)):\n        await cb.answer(\"❌ Turnir topilmadi.\", show_alert=True)\n        return\n    text, markup = await parts_view(int(tid), int(page))\n    await safe_edit(cb.message, text, markup)\n    await cb.answer()\n\n\n@router.callback_query(F.data.startswith(\"ak:\"))\nasync def cb_kick(cb: CallbackQuery, bot: Bot):\n    _, tid_raw, uid_raw, page_raw = cb.data.split(\":\")\n    tid, uid, page = int(tid_raw), int(uid_raw), int(page_raw)\n    t = await db.get_tournament(tid)\n    if not t:\n        await cb.answer(\"❌ Turnir topilmadi.\", show_alert=True)\n        return\n    removed = await db.leave(tid, uid)\n    if removed:\n        spawn(broadcast_report(\n            bot, [uid],\n            f\"⚠️ Siz <b>{esc(t['name'])}<\/b> turniridan admin tomonidan chiqarildingiz.\\n\"\n            \"Savollar bo'lsa, admin bilan bog'laning.\"))\n    text, markup = await parts_view(tid, page)\n    await safe_edit(cb.message, text, markup)\n    await cb.answer(\"✅ Ishtirokchi chiqarildi\" if removed else \"Ishtirokchi topilmadi\")\n\n\n# ═════════════════ G'oliblarni belgilash ═════════════════\n@router.callback_query(F.data.startswith(\"awp:\"))\nasync def cb_win_place(cb: CallbackQuery):\n    _, tid_raw, place_raw = cb.data.split(\":\")\n    tid, place = int(tid_raw), int(place_raw)\n    parts = await db.list_participants(tid)\n    if not parts:\n        await cb.answer(\"Bu turnirda ishtirokchi yo'q.\", show_alert=True)\n        return\n    await safe_edit(\n        cb.message,\n        f\"🏅 <b>{place}-o'rin<\/b> uchun ishtirokchini tanlang:\"\n        + (\"\\n<i>Faqat dastlabki 60 ta ko'rsatilgan.<\/i>\" if len(parts) > 60 else \"\"),\n        kb.pick_winner_kb(tid, place, parts[:60]),\n    )\n    await cb.answer()\n\n\n@router.callback_query(F.data.startswith(\"aws:\"))\nasync def cb_win_set(cb: CallbackQuery):\n    _, tid_raw, place_raw, uid_raw = cb.data.split(\":\")\n    tid, place, uid = int(tid_raw), int(place_raw), int(uid_raw)\n    if not await db.get_participant(tid, uid):\n        await cb.answer(\"Ishtirokchi topilmadi.\", show_alert=True)\n        return\n    await db.set_winner(tid, uid, place)\n    text, markup = await win_view(tid)\n    await safe_edit(cb.message, text, markup)\n    await cb.answer(f\"✅ {place}-o'rin belgilandi\")\n\n\n@router.callback_query(F.data.startswith(\"awc:\"))\nasync def cb_win_clear(cb: CallbackQuery):\n    tid = int(cb.data.split(\":\")[1])\n    await db.clear_winners(tid)\n    text, markup = await win_view(tid)\n    await safe_edit(cb.message, text, markup)\n    await cb.answer(\"🧹 Tozalandi\")\n\n\n# ═════════════════ Turnir yaratish ═════════════════\n@router.callback_query(F.data == \"a:create\")\nasync def cb_create(cb: CallbackQuery, state: FSMContext):\n    await state.clear()\n    await state.set_state(CreateState.name)\n    await cb.message.answer(\n        \"➕ <b>Yangi turnir yaratish<\/b>\\n━━━━━━━━━━━━━━━━━━\\n\"\n        \"<b>1/5<\/b> — Turnir nomini yuboring:\\n<i>Masalan: Oktyabr Kubogi<\/i>\",\n        reply_markup=kb.cancel_kb(),\n    )\n    await cb.answer()\n\n\n@router.message(StateFilter(CreateState.name), F.text)\nasync def create_name(message: Message, state: FSMContext):\n    value, err = validate_name(message.text.strip())\n    if err:\n        await message.answer(err)\n        return\n    await state.update_data(name=value)\n    await state.set_state(CreateState.mode)\n    await message.answer(\"<b>2/5<\/b> — O'yin rejimini tanlang:\", reply_markup=kb.mode_kb(\"cm\"))\n\n\n@router.callback_query(StateFilter(CreateState.mode), F.data.startswith(\"cm:\"))\nasync def create_mode(cb: CallbackQuery, state: FSMContext):\n    mode = cb.data.split(\":\")[1]\n    if mode not in MODES:\n        await cb.answer(\"Noto'g'ri rejim\", show_alert=True)\n        return\n    await state.update_data(mode=mode)\n    await state.set_state(CreateState.max_players)\n    await safe_edit(cb.message, f\"✅ Rejim: <b>{MODES[mode]}<\/b>\")\n    await cb.message.answer(\"<b>3/5<\/b> — Qatnashchilar sonini yuboring (2–500):\\n<i>Masalan: 16<\/i>\")\n    await cb.answer()\n\n\n@router.message(StateFilter(CreateState.max_players), F.text)\nasync def create_max(message: Message, state: FSMContext):\n    value, err = validate_max(message.text.strip())\n    if err:\n        await message.answer(err)\n        return\n    await state.update_data(max_players=value)\n    await state.set_state(CreateState.prize)\n    await message.answer(\"<b>4/5<\/b> — Sovrinni yuboring:\\n<i>Masalan: 1-o'rin 50 000 so'm + Brawl Pass<\/i>\")\n\n\n@router.message(StateFilter(CreateState.prize), F.text)\nasync def create_prize(message: Message, state: FSMContext):\n    value, err = validate_prize(message.text.strip())\n    if err:\n        await message.answer(err)\n        return\n    await state.update_data(prize=value)\n    await state.set_state(CreateState.start_time)\n    await message.answer(\n        f\"<b>5/5<\/b> — Boshlanish vaqtini yuboring ({TZ_LABEL}):\\n\"\n        \"Format: <code>KK.OO.YYYY SS:DD<\/code>\\n\"\n        f\"Masalan: <code>{example_dt()}<\/code>\"\n    )\n\n\n@router.message(StateFilter(CreateState.start_time), F.text)\nasync def create_time(message: Message, state: FSMContext):\n    ts, err = validate_time(message.text.strip())\n    if err:\n        await message.answer(err)\n        return\n    data = await state.get_data()\n    tid = await db.create_tournament(data[\"name\"], data[\"mode\"], data[\"max_players\"], data[\"prize\"], ts)\n    await state.clear()\n    t = await db.get_tournament(tid)\n    await message.answer(\"✅ <b>Turnir muvaffaqiyatli yaratildi!<\/b>\", reply_markup=kb.main_menu(True))\n    await message.answer(tournament_text(t), reply_markup=kb.created_kb(tid))\n\n\n@router.callback_query(F.data.startswith(\"an:\"))\nasync def cb_announce_new(cb: CallbackQuery, bot: Bot):\n    tid = int(cb.data.split(\":\")[1])\n    t = await db.get_tournament(tid)\n    if not t:\n        await cb.answer(\"❌ Turnir topilmadi.\", show_alert=True)\n        return\n    ids = await db.all_user_ids()\n    spawn(broadcast_report(\n        bot, ids, \"🔔 <b>YANGI TURNIR!<\/b>\\n\\n\" + tournament_text(t),\n        report_to=cb.from_user.id, label=\"Yangi turnir e'loni\",\n        reply_markup=kb.view_tournament_kb(tid)))\n    await cb.answer(f\"📣 {len(ids)} ta foydalanuvchiga yuborilmoqda...\", show_alert=True)\n\n\n# ═════════════════ Turnirni tahrirlash ═════════════════\nEDIT_PROMPTS = {\n    \"name\": \"📝 Yangi <b>nom<\/b>ni yuboring:\",\n    \"max\": \"👥 Yangi <b>joylar sonini<\/b> yuboring (2–500):\",\n    \"prize\": \"💰 Yangi <b>sovrin<\/b>ni yuboring:\",\n    \"time\": f\"🕒 Yangi <b>boshlanish vaqti<\/b>ni yuboring ({TZ_LABEL}):\\nFormat: <code>KK.OO.YYYY SS:DD<\/code>\",\n}\n\n\n@router.callback_query(F.data.startswith(\"ae:\"))\nasync def cb_edit_field(cb: CallbackQuery, state: FSMContext):\n    _, field, tid_raw = cb.data.split(\":\")\n    tid = int(tid_raw)\n    t = await db.get_tournament(tid)\n    if not t:\n        await cb.answer(\"❌ Turnir topilmadi.\", show_alert=True)\n        return\n    if field == \"mode\":\n        await safe_edit(cb.message, \"🎮 Yangi rejimni tanlang:\", kb.mode_kb(\"aem\", f\":{tid}\"))\n    elif field in EDIT_PROMPTS:\n        await state.clear()\n        await state.set_state(EditState.value)\n        await state.update_data(tid=tid, field=field)\n        await cb.message.answer(EDIT_PROMPTS[field], reply_markup=kb.cancel_kb())\n    await cb.answer()\n\n\n@router.callback_query(F.data.startswith(\"aem:\"))\nasync def cb_edit_mode(cb: CallbackQuery):\n    _, mode, tid_raw = cb.data.split(\":\")\n    tid = int(tid_raw)\n    if mode not in MODES or not await db.get_tournament(tid):\n        await cb.answer(\"❌ Xatolik: turnir yoki rejim topilmadi.\", show_alert=True)\n        return\n    await db.update_tournament(tid, mode=mode)\n    t = await db.get_tournament(tid)\n    await safe_edit(cb.message, \"✅ Rejim yangilandi!\\n\\n\" + tournament_text(t), kb.edit_fields_kb(tid))\n    await cb.answer(\"✅ Saqlandi\")\n\n\n@router.message(StateFilter(EditState.value), F.text)\nasync def edit_value(message: Message, state: FSMContext, bot: Bot):\n    data = await state.get_data()\n    tid, field = data.get(\"tid\"), data.get(\"field\")\n    t = await db.get_tournament(tid) if tid else None\n    if not t:\n        await state.clear()\n        await finish_flow(message, \"❌ Turnir topilmadi (o'chirilgan bo'lishi mumkin).\")\n        return\n    raw = message.text.strip()\n    notify_time = False\n\n    if field == \"name\":\n        value, err = validate_name(raw)\n        column = \"name\"\n    elif field == \"max\":\n        value, err = validate_max(raw)\n        column = \"max_players\"\n        if not err and value < t[\"cnt\"]:\n            err = f\"⚠️ Hozir {t['cnt']} ta ishtirokchi bor. Joylar soni undan kam bo'lmasin. Qayta yuboring:\"\n    elif field == \"prize\":\n        value, err = validate_prize(raw)\n        column = \"prize\"\n    elif field == \"time\":\n        value, err = validate_time(raw)\n        column = \"start_time\"\n        notify_time = True\n    else:\n        await state.clear()\n        await finish_flow(message, \"⚠️ Noma'lum maydon.\")\n        return\n\n    if err:\n        await message.answer(err)\n        return\n\n    await db.update_tournament(tid, **{column: value})\n    await state.clear()\n    t = await db.get_tournament(tid)\n\n    if notify_time:\n        ids = await participant_ids(tid)\n        if ids:\n            spawn(broadcast_report(\n                bot, ids,\n                f\"⚠️ <b>{esc(t['name'])}<\/b> turnirining boshlanish vaqti o'zgardi!\\n\"\n                f\"🕒 Yangi vaqt: <b>{fmt_dt(t['start_time'], True)}<\/b>\",\n                report_to=message.from_user.id, label=\"Vaqt o'zgarishi xabari\"))\n\n    await message.answer(\"✅ <b>Muvaffaqiyatli yangilandi!<\/b>\", reply_markup=kb.main_menu(True))\n    await message.answer(tournament_text(t), reply_markup=kb.edit_fields_kb(tid))\n\n\n# ═════════════════ Hammaga xabar yuborish ═════════════════\n@router.callback_query(F.data == \"a:bc\")\nasync def cb_broadcast(cb: CallbackQuery, state: FSMContext):\n    await state.clear()\n    await state.set_state(BroadcastState.text)\n    await cb.message.answer(\n        \"✉️ <b>Hammaga xabar<\/b>\\n━━━━━━━━━━━━━━━━━━\\n\"\n        \"Yuboriladigan xabar matnini yozing.\\n\"\n        \"<i>Qalin, kursiv kabi Telegram formatlash qo'llab-quvvatlanadi.<\/i>\",\n        reply_markup=kb.cancel_kb(),\n    )\n    await cb.answer()\n\n\n@router.message(StateFilter(BroadcastState.text), F.text)\nasync def broadcast_text(message: Message, state: FSMContext):\n    text = message.html_text\n    if len(text) > 3900:\n        await message.answer(\"⚠️ Xabar juda uzun (3900 belgidan oshmasin). Qisqartirib qayta yuboring:\")\n        return\n    await state.update_data(text=text)\n    await state.set_state(BroadcastState.confirm)\n    users = len(await db.all_user_ids())\n    await message.answer(f\"👀 <b>Ko'rinishi:<\/b>\\n\\n{text}\\n\\n━━━━━━━━━━━━━━━━━━\\n\"\n                         f\"👤 Qabul qiluvchilar: <b>{users}<\/b> ta.\\nYuboramizmi?\",\n                         reply_markup=kb.broadcast_confirm_kb())\n\n\n@router.callback_query(StateFilter(BroadcastState.confirm), F.data == \"bc:yes\")\nasync def broadcast_go(cb: CallbackQuery, state: FSMContext, bot: Bot):\n    data = await state.get_data()\n    await state.clear()\n    text = data.get(\"text\")\n    if not text:\n        await cb.answer(\"Matn topilmadi.\", show_alert=True)\n        return\n    ids = await db.all_user_ids()\n    spawn(broadcast_report(bot, ids, f\"📨 <b>Admin xabari<\/b>\\n\\n{text}\",\n                           report_to=cb.from_user.id, label=\"Ommaviy xabar\"))\n    await safe_edit(cb.message, f\"📨 Xabar yuborilmoqda ({len(ids)} ta foydalanuvchi)...\\n\"\n                                \"Tugagach hisobot keladi.\", kb.admin_back_kb())\n    await cb.message.answer(\"✅ Boshlandi.\", reply_markup=kb.main_menu(True))\n    await cb.answer()\n\n\n# ═════════════════ Yangilik qo'shish ═════════════════\n@router.callback_query(F.data == \"a:news\")\nasync def cb_news(cb: CallbackQuery, state: FSMContext):\n    await state.clear()\n    await state.set_state(NewsState.text)\n    await cb.message.answer(\"📢 <b>Yangi yangilik<\/b>\\n━━━━━━━━━━━━━━━━━━\\nYangilik matnini yuboring:\",\n                            reply_markup=kb.cancel_kb())\n    await cb.answer()\n\n\n@router.message(StateFilter(NewsState.text), F.text)\nasync def news_text(message: Message, state: FSMContext):\n    text = message.html_text\n    if len(text) > 3500:\n        await message.answer(\"⚠️ Yangilik juda uzun (3500 belgidan oshmasin). Qisqartirib qayta yuboring:\")\n        return\n    await state.update_data(text=text)\n    await state.set_state(NewsState.confirm)\n    await message.answer(f\"👀 <b>Ko'rinishi:<\/b>\\n\\n{text}\", reply_markup=kb.news_confirm_kb())\n\n\n@router.callback_query(StateFilter(NewsState.confirm), F.data.in_({\"nw:send\", \"nw:save\"}))\nasync def news_go(cb: CallbackQuery, state: FSMContext, bot: Bot):\n    data = await state.get_data()\n    await state.clear()\n    text = data.get(\"text\")\n    if not text:\n        await cb.answer(\"Matn topilmadi.\", show_alert=True)\n        return\n    await db.add_news(text)\n    if cb.data == \"nw:send\":\n        ids = await db.all_user_ids()\n        spawn(broadcast_report(bot, ids, f\"📢 <b>YANGILIK<\/b>\\n━━━━━━━━━━━━━━━━━━\\n\\n{text}\",\n                               report_to=cb.from_user.id, label=\"Yangilik yuborildi\"))\n        result = f\"✅ Yangilik saqlandi va {len(ids)} ta foydalanuvchiga yuborilmoqda.\"\n

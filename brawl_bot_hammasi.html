    else:\n        result = \"✅ Yangilik saqlandi.\"\n    await safe_edit(cb.message, result, kb.admin_back_kb())\n    await cb.message.answer(\"👌\", reply_markup=kb.main_menu(True))\n    await cb.answer()\n"}, {"path": "handlers/common.py", "code": "\"\"\"Boshqa handlerlar ushlamagan xabar va tugmalar uchun (eng oxirgi router).\"\"\"\nfrom aiogram import Router\nfrom aiogram.fsm.context import FSMContext\nfrom aiogram.types import CallbackQuery, Message\n\nimport keyboards as kb\nfrom config import ADMIN_IDS\n\nrouter = Router(name=\"fallback\")\n\n\n@router.callback_query()\nasync def stale_callback(cb: CallbackQuery):\n    await cb.answer(\"⚠️ Bu tugma eskirgan yoki sizga ruxsat yo'q. /start ni bosing.\", show_alert=True)\n\n\n@router.message()\nasync def unknown_message(message: Message, state: FSMContext):\n    if await state.get_state():\n        await message.answer(\n            \"⚠️ Noto'g'ri format. Iltimos, so'ralgan ma'lumotni <b>matn<\/b> ko'rinishida yuboring \"\n            \"yoki «❌ Bekor qilish» tugmasini bosing.\"\n        )\n    else:\n        await message.answer(\n            \"🤔 Tushunmadim. Iltimos, quyidagi menyudan foydalaning 👇\",\n            reply_markup=kb.main_menu(message.from_user.id in ADMIN_IDS),\n        )\n"}, {"path": "handlers/errors.py", "code": "\"\"\"Global xatolarni qayta ishlash tizimi.\"\"\"\nimport logging\n\nfrom aiogram import Bot, Router\nfrom aiogram.exceptions import TelegramAPIError, TelegramBadRequest\nfrom aiogram.types.error_event import ErrorEvent\n\nfrom config import ADMIN_IDS\n\nlog = logging.getLogger(__name__)\nrouter = Router(name=\"errors\")\n\n\n@router.errors()\nasync def on_error(event: ErrorEvent, bot: Bot) -> bool:\n    exc = event.exception\n\n    # Zararsiz holat: xabar o'zgarmagan yoki eski callback\n    if isinstance(exc, TelegramBadRequest) and (\n        \"message is not modified\" in str(exc)\n        or \"query is too old\" in str(exc)\n        or \"query ID is invalid\" in str(exc)\n    ):\n        return True\n\n    log.error(\"Handlerda xatolik: %r\", exc, exc_info=exc)\n    update = event.update\n\n    # Foydalanuvchiga muloyim xabar\n    try:\n        if update.callback_query:\n            await update.callback_query.answer(\n                \"⚠️ Kutilmagan xatolik yuz berdi. Iltimos, qayta urinib ko'ring.\", show_alert=True\n            )\n        elif update.message:\n            await update.message.answer(\"⚠️ Kutilmagan xatolik yuz berdi. Iltimos, /start ni bosib qayta urinib ko'ring.\")\n    except TelegramAPIError:\n        pass\n\n    # Adminga qisqa hisobot\n    for admin_id in ADMIN_IDS:\n        try:\n            await bot.send_message(\n                admin_id,\n                f\"🚨 <b>Bot xatoligi<\/b>\\n<code>{type(exc).__name__}<\/code>\\nBatafsil: logs/bot.log\",\n            )\n        except TelegramAPIError:\n            pass\n    return True\n"}]</script>
<script>
var F=JSON.parse(document.getElementById('data').textContent),cur=0;
var nav=document.getElementById('nav'),code=document.getElementById('code'),fn=document.getElementById('fn');
function show(i){cur=i;code.textContent=F[i].code;fn.textContent=F[i].path;
 [].forEach.call(nav.children,function(a,j){a.className=j===i?'on':''});}
F.forEach(function(f,i){var a=document.createElement('a');a.textContent=f.path;a.onclick=function(){show(i)};nav.appendChild(a)});
function copy(t,btn){var done=function(){var o=btn.textContent;btn.textContent='✅ Nusxalandi';setTimeout(function(){btn.textContent=o},1500)};
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,fb)}else fb();
 function fb(){var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){}ta.remove()}}
function save(name,text){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
document.getElementById('cp').onclick=function(){copy(F[cur].code,this)};
document.getElementById('dl').onclick=function(){save(F[cur].path.split('/').pop(),F[cur].code)};
document.getElementById('cpAll').onclick=function(){copy(F.map(function(f){return '# ===== '+f.path+' =====\n'+f.code}).join('\n\n'),this)};
document.getElementById('dlAll').onclick=function(){F.forEach(function(f,i){setTimeout(function(){save(f.path.split('/').pop(),f.code)},i*300)})};
show(0);
</script></body></html>
